<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2a1458">
<title>العب وتحرّك - الإصدار المطور</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:#2a1458;font-family:'Fredoka One',system-ui,-apple-system,sans-serif;color:#fff;touch-action:manipulation}
/* منع الكانفاس من سرقة ضغطات الأزرار */
#c{position:fixed;left:0;top:0;width:100%;height:100%;display:block;pointer-events:none;z-index:1}
[hidden]{display:none!important}
button{font:inherit;color:#fff;border:0;cursor:pointer}
.glass{background:rgba(255,255,255,.15);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:2px solid rgba(255,255,255,.4);box-shadow:0 8px 28px rgba(0,0,0,.3)}
#menu{position:fixed;inset:0;overflow:auto;text-align:center;padding:calc(env(safe-area-inset-top,0px) + 16px) 14px calc(env(safe-area-inset-bottom,0px) + 16px);background:radial-gradient(circle at 15% 8%,#ff5fa2 0,transparent 42%),radial-gradient(circle at 88% 28%,#35c8ff 0,transparent 42%),radial-gradient(circle at 40% 98%,#ffc93c 0,transparent 38%),#2a1458;z-index:10;pointer-events:auto}
h1{margin:6px 0 2px;font-size:36px;text-shadow:0 4px 0 rgba(0,0,0,.3);letter-spacing:1px}
.sub{opacity:.9;margin:0 0 12px;font-size:15px}
.ages{display:flex;gap:10px;max-width:520px;margin:0 auto 14px}
.ages button{flex:1;padding:12px;border-radius:20px;font-size:18px;font-weight:700;background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.3);transition:all .2s;touch-action:manipulation}
.ages button.on{background:#fff;color:#4a2a9a;box-shadow:0 4px 0 #ccc}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:520px;margin:0 auto}
/* تحسين استجابة الأزرار */
.card{border-radius:24px;padding:16px 8px;font-size:19px;font-weight:800;line-height:1.35;box-shadow:0 6px 0 rgba(0,0,0,.3),0 12px 24px rgba(0,0,0,.2);transition:transform .1s,opacity .2s;border:2px solid rgba(255,255,255,.2);cursor:pointer;touch-action:manipulation;position:relative;user-select:none;-webkit-user-select:none;pointer-events:auto}
.card:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.3)}
.card:last-child{grid-column:span 2}
.card i{display:block;font-style:normal;font-size:48px;filter:drop-shadow(0 4px 4px rgba(0,0,0,.25))}
.card small{display:block;font-size:12px;font-weight:500;opacity:.95}
#err{color:#ffd6d6;min-height:22px;margin-top:12px;font-size:15px;font-weight:bold}
.tip{font-size:13px;opacity:.85;max-width:520px;margin:6px auto}
#hud{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 6px) 10px 0;pointer-events:none;z-index:10}
#hud>*{pointer-events:auto}
.bar{display:flex;align-items:center;justify-content:space-between;border-radius:20px;padding:4px 10px;background:rgba(40,20,90,.6)}
.ib{background:#fff; color:#4a2a9a; border-radius:14px; padding:6px 12px; font-weight:900; box-shadow:0 4px 0 #999; margin:0 2px; transition:transform .1s; touch-action:manipulation;}
.ib:active{transform:translateY(4px); box-shadow:0 0 0 #999}
#ttl{font-size:14px}#st{font-size:20px; color:#ffd23f; text-shadow:0 2px 0 #b38000, 0 0 10px #ffd23f}
#pr{margin:6px auto 0;width:fit-content;max-width:95%;border-radius:20px;padding:8px 20px;font-size:clamp(16px,4vw,22px);font-weight:800;text-align:center;background:rgba(30,15,70,0.8);border:3px solid #fff;box-shadow:0 6px 0 #4a2a9a, 0 10px 20px rgba(0,0,0,0.3);text-shadow: 0 2px 4px rgba(0,0,0,0.5);}
#mt{margin:6px auto 0;width:40%;max-width:220px;height:8px;border-radius:8px;background:rgba(0,0,0,.4);overflow:hidden;border:1px solid rgba(255,255,255,.3)}
#mt i{display:block;height:100%;width:0;background:linear-gradient(90deg,#46e0a0,#ffd23f,#ff5f7a);transition:width .1s}
#bn{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:clamp(40px, 12vw, 90px);font-weight:900;color:#fff;font-family:'Fredoka One',sans-serif;-webkit-text-stroke:4px #ff3da6;paint-order:stroke fill;text-shadow:0 6px 0 #4a2a9a, 0 0 30px rgba(255, 61, 166, 0.8);pointer-events:none;opacity:0;transform:scale(.4);transition:all .3s cubic-bezier(0.175, 0.885, 0.32, 1.275);text-align:center;padding:0 10px;z-index:20}
#bn.on{opacity:1;transform:scale(1)}
#end{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);transform:translateX(-50%);width:min(90vw,400px);border-radius:24px;padding:16px;text-align:center;background:rgba(60,30,140,.95);border:3px solid #fff;z-index:30;pointer-events:auto}
#end h2{margin:0 0 4px;font-size:22px;color:#ffd23f}#end p{font-size:16px;margin:6px 0 12px}
#end button{display:block;width:100%;margin:8px 0;padding:12px;border-radius:16px;font-size:18px;font-weight:800;background:#ff5fa2;box-shadow:0 4px 0 #c4266e;transition:all .1s;touch-action:manipulation}
#end button:active{transform:translateY(4px);box-shadow:0 0 0 #c4266e}
#end button+button{background:#4fb7ff;box-shadow:0 4px 0 #2a7bcc}
#v{position:fixed;width:2px;height:2px;opacity:0;pointer-events:none}
@media(max-height:520px){#bn{font-size:9vw} .card{padding:10px 4px} .card i{font-size:32px}}
#studio{position:fixed;inset:0;background:rgba(20,8,60,.95);display:flex;align-items:center;justify-content:center;padding:12px;z-index:40}
.sbox{width:min(94vw,460px);border-radius:26px;padding:20px;text-align:center;background:rgba(255,255,255,.1)}
.srow{display:flex;gap:8px;justify-content:space-between;align-items:center;margin:8px 0}
#stx{font-size:clamp(20px,5vw,28px);font-weight:800;margin:12px 0;min-height:2.6em;color:#ffd23f}
.sb{flex:1;padding:14px;border-radius:16px;font-size:17px;font-weight:700;background:#7a4ae8;margin:4px 0;width:100%;box-shadow:0 4px 0 #4a2a9a;border:2px solid rgba(255,255,255,.2);touch-action:manipulation}
.sb:active{transform:translateY(4px);box-shadow:0 0 0 #4a2a9a}
#srec.rec{background:#e53950;box-shadow:0 4px 0 #a01a2d}
</style>
</head>
<body>
<canvas id="c"></canvas>
<video id="v" playsinline muted autoplay></video>

<section id="menu">
  <h1>🎈 العب وتحرّك</h1>
  <p class="sub">ألعاب تلعبها بحركتك أمام الكاميرا، بدون لمس الشاشة</p>
  <div class="ages"><button id="a3" class="on" onclick="setAge(3)">👶 عمر 3 سنوات</button><button id="a5" onclick="setAge(5)">🧒 عمر 5 سنوات</button></div>
  <div class="cards">
    <!-- تمرير this لتمرير الزر المظغوط لإظهار حالة التحميل -->
    <button class="card" style="background:linear-gradient(145deg,#ffb347,#ff6a3d)" onclick="start('fruit', this)"><i>🍊</i>قطف الثمار<small>مدّ يدك للأعلى واقطفها</small></button>
    <button class="card" style="background:linear-gradient(145deg,#37c8d8,#2a6fd8)" onclick="start('rocks', this)"><i>💎</i>حطّم الصخور<small>اضرب الصخرة بيدك</small></button>
    <button class="card" style="background:linear-gradient(145deg,#b784ff,#ff6fb1)" onclick="start('animals', this)"><i>🐰</i>قلّد الحيوانات<small>اقفز، افرد جناحيك، اجلس</small></button>
    <button class="card" style="background:linear-gradient(145deg,#7fdc5a,#2f9a4a)" onclick="start('hedge', this)"><i>🦔</i>اصطد القنافذ<small>المس القنافذ بيدك</small></button>
    <button class="card" style="background:linear-gradient(145deg,#ffd84d,#7dff9a)" onclick="start('pads', this)"><i>👣</i>ادعس الدوائر<small>ادعس الدائرة المضيئة</small></button>
    <button class="card" style="background:linear-gradient(145deg,#2fd27a,#0f8a5a)" onclick="start('math', this)"><i>🧮</i>غابة الأرقام<small>أجب عن المسألة بحركة يدك</small></button>
    <button class="card" style="background:linear-gradient(145deg,#a58bff,#6a3fd8)" onclick="start('letters', this)"><i>🔤</i>الكرات السحرية<small>اختر الحرف الصحيح بيدك</small></button>
    <button class="card" style="background:linear-gradient(145deg,#59d0ff,#2f7bff)" onclick="start('dragon', this)"><i>🐉</i>طيران التنين<small>حرّك جسمك لتجمع الكرز</small></button>
    <button class="card" style="background:linear-gradient(145deg,#ff8a5c,#ff4f7b)" onclick="start('dance', this)"><i>💃</i>ارقص مع الحيوانات<small>كلما تحركت أكثر رقص أكثر</small></button>
    <button class="card" style="background:linear-gradient(145deg,#4fb7ff,#4a63ff)" onclick="start('copy', this)"><i>🧒</i>قلّد الحركة<small>أعلى، أسفل، يمين، يسار</small></button>
    <button class="card" style="background:linear-gradient(145deg,#47e0a0,#12a58c)" onclick="start('color', this)"><i>🎨</i>أشر إلى اللون<small>أشر إلى الفقاعة الملونة</small></button>
    <button class="card" style="background:linear-gradient(145deg,#ffd23f,#ff9a2e)" onclick="start('balloons', this)"><i>🎈</i>فرقع البالونات<small>المس البالون بيدك</small></button>
    <button class="card" style="background:linear-gradient(145deg,#8fd3ff,#5b8cff)" onclick="start('freeze', this)"><i>🧊</i>ارقص وتجمّد<small>تجمّد عندما تتوقف الموسيقى</small></button>
  </div>
  <button class="card" style="display:block;width:100%;max-width:520px;margin:12px auto 0;background:linear-gradient(145deg,#ff7aa2,#c84bd8)" onclick="studio(1)"><i>🎙️</i>استوديو الصوت<small>سجّل صوت طفل أو أم لكل كلمات اللعبة</small></button>
  <div id="err"></div>
  <p class="tip">ضع الهاتف على حامل ثابت وبشكل أفقي أمام الأطفال بمسافة 2 إلى 3 أمتار. يُنصح بإشراف شخص بالغ.</p>
</section>

<div id="hud" hidden>
  <div class="bar glass">
    <button class="ib" onclick="home()">⬅ رجوع</button>
    <b id="ttl"></b>
    <span id="st">⭐ 0</span>
    <span id="tm" style="font-size:14px;font-weight:bold;">30:00</span>
    <span><button class="ib" onclick="viewMode()">📐</button><button class="ib" onclick="flip()">🔄</button></span>
  </div>
  <div id="pr" class="glass"></div>
  <div id="mt"><i></i></div>
</div>

<div id="bn"></div>

<div id="studio" hidden><div class="sbox glass">
  <div class="srow"><b>🎙️ استوديو الصوت</b><button class="ib" onclick="studio(0)">✖ إغلاق</button></div>
  <div id="sn"></div><div id="stx"></div><div id="sst"></div>
  <div class="srow"><button id="srec" class="sb" onclick="srec()">🎙️ سجّل</button><button class="sb" onclick="splay()">▶ استمع</button></div>
  <div class="srow"><button class="sb" onclick="snav(-1)">⏮ السابق</button><button class="sb" onclick="snav(1)">⏭ التالي</button></div>
  <button class="sb" style="background:#e53950; box-shadow:0 4px 0 #a01a2d;" onclick="sdel()">🗑 حذف تسجيل هذه الجملة</button>
  <p style="font-size:13px;opacity:.85;margin:12px 0 0">اقرأ الجملة بصوت واضح. بعد الإيقاف ينتقل تلقائيًا للجملة التالية.</p>
</div></div>

<div id="end" hidden><h2>⏰ انتهت 30 دقيقة من اللعب</h2><p id="ep"></p><button onclick="extend()">▶ أكمل 30 دقيقة أخرى</button><button onclick="home()">🏠 اختر لعبة أخرى</button></div>

<script>
const $=i=>document.getElementById(i);
const cvs=$('c'),g=cvs.getContext('2d'),v=$('v'),an=document.createElement('canvas'),ag=an.getContext('2d',{willReadFrequently:true});
let pm=0,avgB=128,low=false,mode=0,fill=false,SW=0,SH=0,PX=0,PY=0,vk="",camIdx=0,cams=[{f:"user",n:"الكاميرا الأمامية"},{f:"environment",n:"الكاميرا الخلفية"}],W=0,H=0,AW=40,AH=80,age=3,goal=5,game='',run=false,stars=0,facing='user',stream=null,ac=null,music=false,endT=0,last=0,T=0,S={};
let cxm=.5,prevL=null,hasPrev=false,mot=null,frame=null,sm=0,lv=0,P=[],lastFail=0;
const COL=[['الأحمر','#ff4d5e',h=>h<14||h>346],['الأصفر','#ffd23f',h=>h>44&&h<68],['الأخضر','#38c172',h=>h>85&&h<160],['الأزرق','#3d8bff',h=>h>195&&h<250],['البرتقالي','#ff9a2e',h=>h>=18&&h<=38]];
const MOV=[['ارفع يديك للأعلى','⬆️','top'],['انزل للأسفل','⬇️','bot'],['تحرّك ناحية اليسار','⬅️','left'],['تحرّك ناحية اليمين','➡️','right'],['اقفز عاليًا','🦘','all']];
const ANI=['🐻','🦁','🐼','🐵','🐶','🦄','🐯','🐸','🐰','🦊'];
const OKW=['أحسنت','أحسنت يا بطل','برافو','ممتاز','مثالي','رائع'];
const TT={dance:'💃 الرقص',copy:'🧒 قلّد الحركة',color:'🎨 أشر إلى اللون',balloons:'🎈 البالونات',freeze:'🧊 تجمّد',math:'🧮 غابة الأرقام',letters:'🔤 الكرات السحرية',dragon:'🐉 طيران التنين',fruit:'🍊 قطف الثمار',rocks:'💎 حطّم الصخور',animals:'🐰 قلّد الحيوانات',hedge:'🦔 القنافذ',pads:'👣 الدوائر'};
const P4={top:[.5,.25],bot:[.5,.8],left:[.17,.52],right:[.83,.52]};
const rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.random()*a.length|0];

/* ================== الصور الحقيقية (3D Assets) ================== */
const IMG = {};
function loadImg(name, url) {
  IMG[name] = new Image();
  IMG[name].crossOrigin = "Anonymous";
  IMG[name].src = url;
}
loadImg('fox', 'https://cdn-icons-png.flaticon.com/512/616/616408.png');
loadImg('dragon', 'https://cdn-icons-png.flaticon.com/512/1998/1998664.png');
loadImg('bunny', 'https://cdn-icons-png.flaticon.com/512/1998/1998610.png');
loadImg('octopus', 'https://cdn-icons-png.flaticon.com/512/1998/1998697.png');
loadImg('fruit', 'https://cdn-icons-png.flaticon.com/512/415/415733.png');
loadImg('rock', 'https://cdn-icons-png.flaticon.com/512/2935/2935490.png');
loadImg('star', 'https://cdn-icons-png.flaticon.com/512/1828/1828884.png');

function drawImg(name, x, y, size, rot, fallbackEmoji) {
  if (IMG[name] && IMG[name].complete && IMG[name].naturalWidth > 0) {
    g.save(); g.translate(x, y); g.rotate(rot || 0);
    g.shadowColor = 'rgba(0,0,0,0.4)'; g.shadowBlur = 15; g.shadowOffsetY = 8;
    g.drawImage(IMG[name], -size/2, -size/2, size, size);
    g.restore();
  } else {
    emo(fallbackEmoji, x, y, size, rot);
  }
}
/* ============================================================== */

function fit(){const va=v.videoWidth&&v.videoHeight?v.videoWidth/v.videoHeight:4/3;if(fill){W=SW;H=SH}else if(SW/SH>va){H=SH;W=SH*va}else{W=SW;H=SW/va}PX=(SW-W)/2;PY=(SH-H)/2;AH=Math.round(AW*H/W);an.width=AW;an.height=AH;prevL=null;mot=null}
function resize(){const d=Math.min(devicePixelRatio||1,2);SW=innerWidth;SH=innerHeight;cvs.width=SW*d;cvs.height=SH*d;g.setTransform(d,0,0,d,0,0);fit()}
addEventListener('resize',resize);resize();
function setAge(a){age=a;goal=a==3?5:8;$('a3').className=a==3?'on':'';$('a5').className=a==5?'on':''}
const SIL='data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=';

/* ================== إصلاح الصوت المضمون ================== */
const AEL=new Audio();AEL.preload='auto';
let VB={},VM={},VQ=[],vbusy=false,vgen=0;
let audioUnlocked = false;

function unlockAudioNow() {
  if (audioUnlocked) return;
  audioUnlocked = true;
  
  // 1. تفعيل سياق الصوت (Audio Context) بهدوء
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    const o = ac.createOscillator(), gn = ac.createGain();
    gn.gain.value = 0.0001;
    o.connect(gn); gn.connect(ac.destination);
    o.start(0); o.stop(ac.currentTime + 0.05);
  } catch(e) {}

  // 2. تفعيل عنصر الصوت
  try { AEL.muted = false; AEL.src = SIL; AEL.play().catch(()=>{}); } catch(e) {}

  // 3. تفعيل النطق (TTS) في الخلفية لتجنب تجميد الواجهة
  setTimeout(() => {
    try {
      if (window.speechSynthesis) {
        const u = new SpeechSynthesisUtterance('هيا');
        u.lang = 'ar-SA'; u.volume = 0.01; u.rate = 2;
        speechSynthesis.speak(u);
      }
    } catch(e) {}
  }, 50);
}

if (window.speechSynthesis) {
  try {
    speechSynthesis.getVoices();
    speechSynthesis.onvoiceschanged = () => { try { speechSynthesis.getVoices(); } catch(e){} };
  } catch(e) {}
}
/* ========================================================= */

function norm(t){return String(t).replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}]/gu,'').replace(/\s+/g,' ').trim()}
function vstop(){vgen++;VQ=[];vbusy=false;try{AEL.onended=null;AEL.pause()}catch(e){}try{speechSynthesis.cancel()}catch(e){}}
function say(t,c){t=norm(t);if(!t)return;if(c)vstop();VQ.push(t);if(!vbusy){vbusy=true;vnext()}}
function vnext(){const t=VQ.shift();if(!t){vbusy=false;return}const G=vgen,nx=()=>{if(G==vgen)vnext()},b=VB[t],m=VM[t];
 if(b||m){AEL.onended=nx;AEL.onerror=()=>{if(G==vgen)tts(t,nx)};AEL.src=b?URL.createObjectURL(b):'voice/'+m;AEL.play().catch(()=>{if(G==vgen)tts(t,nx)})}else tts(t,nx)}
function tts(t,nx){try{if(!window.speechSynthesis)return nx();const u=new SpeechSynthesisUtterance(t);u.lang='ar-SA';const vs=speechSynthesis.getVoices().filter(x=>x.lang.replace('_','-').toLowerCase().indexOf('ar')==0);u.voice=vs.find(x=>/laila|mariam|zeina|sara|female/i.test(x.name))||vs[0]||null;u.pitch=1.5;u.rate=.85;u.onend=nx;u.onerror=nx;speechSynthesis.speak(u)}catch(e){nx()}}
const DBP=new Promise(r=>{try{const q=indexedDB.open('kidsvoice',1);q.onupgradeneeded=()=>q.result.createObjectStore('v');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}});
const dbPut=(k,v)=>DBP.then(d=>d&&new Promise(r=>{const x=d.transaction('v','readwrite');x.objectStore('v').put(v,k);x.oncomplete=r;x.onerror=r}));
const dbDel=k=>DBP.then(d=>d&&new Promise(r=>{const x=d.transaction('v','readwrite');x.objectStore('v').delete(k);x.oncomplete=r;x.onerror=r}));
DBP.then(d=>{if(!d)return;const c=d.transaction('v').objectStore('v').openCursor();c.onsuccess=e=>{const x=e.target.result;if(x){VB[x.key]=x.value;x.continue()}}});
fetch('voice/manifest.json').then(r=>r.json()).then(m=>{VM=m}).catch(()=>{});
function beep(f,d,ty){if(!ac)return;const o=ac.createOscillator(),k=ac.createGain();o.type=ty||'triangle';o.frequency.value=f;k.gain.setValueAtTime(.12,ac.currentTime);k.gain.exponentialRampToValueAtTime(.001,ac.currentTime+(d||.15));o.connect(k);k.connect(ac.destination);o.start();o.stop(ac.currentTime+(d||.15))}
const NOTES=[523,587,659,784,880,784,659,587];let ni=0;
setInterval(()=>{if(music&&run)beep(NOTES[ni++%8],.2,'sine')},270);
function banner(t){const b=$('bn');b.textContent=t;b.className='on';setTimeout(()=>b.className='',1000)}
