<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2a1458">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>العب وتحرّك - الإصدار المطور</title>
<style>
:root{
  --ink:#2a1458;--deep:#160a35;--pink:#ff5fa2;--cyan:#35c8ff;--gold:#ffd23f;--mint:#46e0a0;
  --glass:rgba(255,255,255,.08);--glass-brd:rgba(255,255,255,.22);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:var(--deep);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;color:#fff;touch-action:manipulation}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;pointer-events:none;z-index:1}
[hidden]{display:none!important}
button{font:inherit;color:#fff;border:0;cursor:pointer;touch-action:manipulation;background:none}
.glass{background:var(--glass);border:2px solid var(--glass-brd);box-shadow:0 10px 30px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.15)}

/* ====== خلفية القائمة: تدرّج عميق + كرات ضوئية عائمة ====== */
#menu{position:fixed;inset:0;overflow:auto;-webkit-overflow-scrolling:touch;z-index:10;
  background:
    radial-gradient(circle at 50% -10%,rgba(255,255,255,.10) 0,transparent 45%),
    radial-gradient(circle at 15% 8%,#ff5fa2 0,transparent 42%),
    radial-gradient(circle at 88% 28%,#35c8ff 0,transparent 42%),
    radial-gradient(circle at 40% 98%,#ffc93c 0,transparent 38%),
    linear-gradient(180deg,#1a0b40 0%,#2a1458 55%,#1c0d44 100%)}
.orbs{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.orbs i{position:absolute;border-radius:50%;filter:blur(2px);opacity:.5;animation:float 14s ease-in-out infinite}
.orbs i:nth-child(1){width:130px;height:130px;left:6%;top:14%;background:radial-gradient(circle at 32% 30%,#ffd6ec,#ff5fa2 70%);animation-duration:11s}
.orbs i:nth-child(2){width:90px;height:90px;right:8%;top:10%;background:radial-gradient(circle at 32% 30%,#d6f2ff,#35c8ff 70%);animation-duration:16s;animation-delay:-4s}
.orbs i:nth-child(3){width:70px;height:70px;left:16%;bottom:12%;background:radial-gradient(circle at 32% 30%,#fff3c4,#ffc93c 70%);animation-duration:13s;animation-delay:-7s}
.orbs i:nth-child(4){width:110px;height:110px;right:14%;bottom:16%;background:radial-gradient(circle at 32% 30%,#d9ffe9,#46e0a0 70%);animation-duration:18s;animation-delay:-2s}
@keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-26px) rotate(8deg)}}
.wrap{position:relative;z-index:2;text-align:center;padding:calc(env(safe-area-inset-top,0px) + 18px) 14px calc(env(safe-area-inset-bottom,0px) + 20px);max-width:560px;margin:0 auto}

.logo{width:74px;height:74px;margin:0 auto 6px;border-radius:24px;display:flex;align-items:center;justify-content:center;font-size:40px;
  background:linear-gradient(145deg,#ff8ac2,#c84bd8);border:2px solid rgba(255,255,255,.35);
  box-shadow:0 10px 24px rgba(200,75,216,.45),inset 0 2px 6px rgba(255,255,255,.4);
  animation:bounce 3.2s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-10px) rotate(3deg)}}
h1{margin:4px 0 2px;font-size:clamp(32px,9vw,44px);font-weight:900;letter-spacing:.5px;
  background:linear-gradient(90deg,#ffd23f,#ff8ac2,#7dd8ff);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 10px rgba(0,0,0,.4))}
.sub{opacity:.92;margin:0 0 14px;font-size:15px}

.ages{display:flex;gap:10px;margin:0 0 14px}
.ages button{flex:1;padding:12px;border-radius:18px;font-size:17px;font-weight:800;
  background:var(--glass);border:2px solid var(--glass-brd);transition:all .2s;backdrop-filter:blur(6px)}
.ages button.on{background:linear-gradient(145deg,#fff,#ffe9f4);color:#4a2a9a;box-shadow:0 5px 0 #d9a7c6,0 10px 20px rgba(0,0,0,.25);transform:translateY(-2px)}

.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{border-radius:22px;padding:16px 8px 14px;font-size:18px;font-weight:800;line-height:1.3;
  box-shadow:0 6px 0 rgba(0,0,0,.35),0 14px 26px rgba(0,0,0,.25);transition:transform .12s,box-shadow .12s,filter .2s;
  border:2px solid rgba(255,255,255,.25);position:relative;user-select:none;-webkit-user-select:none;overflow:hidden}
.card::before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(255,255,255,.35),transparent 45%);pointer-events:none}
.card:active{transform:translateY(5px) scale(.98);box-shadow:0 1px 0 rgba(0,0,0,.35),0 6px 14px rgba(0,0,0,.2)}
.card:disabled{opacity:.7}
.card i{display:block;font-style:normal;font-size:46px;filter:drop-shadow(0 4px 4px rgba(0,0,0,.3));margin-bottom:4px}
.card small{display:block;font-size:12px;font-weight:600;opacity:.95}
.wide-card{display:block;width:100%;margin:14px 0 0}
#err{color:#ffd6d6;min-height:22px;margin-top:12px;font-size:15px;font-weight:800}
.tip{font-size:13px;opacity:.85;margin:10px auto 0;line-height:1.6}

/* ====== HUD ====== */
#hud{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 8px) 10px 0;pointer-events:none;z-index:15}
#hud>*{pointer-events:auto}
.bar{display:flex;align-items:center;justify-content:space-between;border-radius:22px;padding:5px 8px;gap:4px;
  background:rgba(22,10,53,.6);backdrop-filter:blur(8px)}
.ib{background:linear-gradient(145deg,#fff,#e9e2ff);color:#4a2a9a;border-radius:14px;padding:8px 12px;font-weight:900;
  box-shadow:0 4px 0 #b3a3e0;transition:transform .1s;margin:0 2px;font-size:14px}
.ib:active{transform:translateY(3px);box-shadow:0 1px 0 #b3a3e0}
#ttl{font-size:14px;font-weight:800;flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#st{font-size:19px;color:var(--gold);text-shadow:0 2px 0 #b38000;font-weight:900;white-space:nowrap}
#tm{font-size:14px;font-weight:800;background:rgba(255,255,255,.15);padding:5px 9px;border-radius:12px;white-space:nowrap}
#pr{margin:8px auto 0;width:fit-content;max-width:95%;border-radius:22px;padding:9px 22px;font-size:clamp(16px,4vw,22px);font-weight:800;text-align:center;
  background:rgba(22,10,53,.78);border:3px solid #fff;box-shadow:0 6px 0 #4a2a9a,0 12px 26px rgba(0,0,0,.35)}
#mt{margin:7px auto 0;width:42%;max-width:220px;height:9px;border-radius:8px;background:rgba(0,0,0,.45);overflow:hidden;border:1px solid rgba(255,255,255,.35)}
#mt i{display:block;height:100%;width:0;background:linear-gradient(90deg,#46e0a0,#ffd23f,#ff5f7a);border-radius:8px;transition:width .3s}

/* ====== البانر ====== */
#bn{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:clamp(40px,12vw,90px);font-weight:900;color:#fff;
  -webkit-text-stroke:4px #ff3da6;paint-order:stroke fill;text-shadow:0 8px 0 #4a2a9a,0 16px 34px rgba(0,0,0,.45);
  pointer-events:none;opacity:0;transform:scale(.4) rotate(-6deg);transition:all .35s cubic-bezier(.175,.885,.32,1.275);text-align:center;padding:0 10px;z-index:20}
#bn.on{opacity:1;transform:scale(1) rotate(0)}

/* ====== نافذة النهاية ====== */
#end{position:fixed;left:50%;top:50%;bottom:auto;transform:translate(-50%,-50%);width:min(90vw,400px);border-radius:28px;padding:22px 18px;text-align:center;z-index:30;
  background:linear-gradient(160deg,rgba(80,40,180,.97),rgba(40,16,100,.97));border:3px solid #fff;
  box-shadow:0 24px 60px rgba(0,0,0,.5),inset 0 2px 0 rgba(255,255,255,.2);animation:pop .35s cubic-bezier(.175,.885,.32,1.275)}
@keyframes pop{from{transform:translate(-50%,-50%) scale(.7);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
#end h2{margin:0 0 6px;font-size:22px;color:var(--gold)}
#end p{font-size:16px;margin:6px 0 14px;opacity:.95}
#end button{display:block;width:100%;margin:9px 0;padding:13px;border-radius:18px;font-size:18px;font-weight:800;
  background:linear-gradient(145deg,#ff7ab0,#e0449a);box-shadow:0 5px 0 #a92a6e;transition:transform .1s}
#end button:active{transform:translateY(4px);box-shadow:0 1px 0 #a92a6e}
#end button+button{background:linear-gradient(145deg,#5fc3ff,#3a7bf0);box-shadow:0 5px 0 #2456b8}
#end button+button:active{box-shadow:0 1px 0 #2456b8}

#v{position:fixed;width:2px;height:2px;opacity:0;pointer-events:none}
@media(max-height:520px){#bn{font-size:9vw}.card{padding:10px 4px}.card i{font-size:32px}}

/* ====== استوديو الصوت ====== */
#studio{position:fixed;inset:0;background:rgba(14,6,40,.9);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:12px;z-index:40}
.sbox{width:min(94vw,460px);border-radius:28px;padding:22px 18px;text-align:center;background:rgba(35,16,80,.9);
  border:2px solid var(--glass-brd);box-shadow:0 24px 60px rgba(0,0,0,.5);animation:pop .3s cubic-bezier(.175,.885,.32,1.275)}
.srow{display:flex;gap:8px;justify-content:space-between;align-items:center;margin:8px 0}
.srow b{font-size:18px}
#stx{font-size:clamp(20px,5vw,28px);font-weight:800;margin:14px 0;min-height:2.6em;color:var(--gold);line-height:1.4}
#sn{font-size:13px;opacity:.85;margin-bottom:2px}
#sst{font-size:14px;opacity:.95;margin:6px 0 10px}
.sb{flex:1;padding:14px;border-radius:16px;font-size:16px;font-weight:700;background:linear-gradient(145deg,#8a5cf0,#6a3fd8);margin:4px 0;width:100%;
  box-shadow:0 4px 0 #4a2a9a;border:2px solid rgba(255,255,255,.2);transition:transform .1s}
.sb:active{transform:translateY(3px);box-shadow:0 1px 0 #4a2a9a}
#srec.rec{background:linear-gradient(145deg,#ff5b74,#d81f3f);box-shadow:0 4px 0 #a01a2d;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.25)}}
#studio p{font-size:13px;opacity:.85;margin:12px 0 0;line-height:1.6}

/* شريط تمرير أنيق */
#menu::-webkit-scrollbar{width:8px}
#menu::-webkit-scrollbar-thumb{background:rgba(255,255,255,.25);border-radius:8px}
#menu::-webkit-scrollbar-track{background:transparent}
</style>
<base target="_blank">
</head>
<body>
<canvas id="c"></canvas>
<video id="v" playsinline muted autoplay></video>

<section id="menu">
  <div class="orbs"><i></i><i></i><i></i><i></i></div>
  <div class="wrap">
  <div class="logo">🎈</div>
  <h1>العب وتحرّك</h1>
  <p class="sub">ألعاب تلعبها بحركتك أمام الكاميرا، بدون لمس الشاشة</p>
  <div class="ages"><button id="a3" class="on" onclick="setAge(3)">👶 عمر 3 سنوات</button><button id="a5" onclick="setAge(5)">🧒 عمر 5 سنوات</button></div>
  <button class="card wide-card" style="background:linear-gradient(145deg,#5ee0ff,#7a5cff);margin:0 0 14px" onclick="start('gmenu',this)"><i>🖐️</i>اختر اللعبة بالإشارة<small>لوّح بيدك من بعيد فوق اللعبة دون لمس الشاشة</small></button>
  <div class="cards">
    <button class="card" style="background:linear-gradient(145deg,#ffb347,#ff6a3d)" onclick="start('fruit',this)"><i>🍊</i>قطف الثمار<small>مدّ يدك للأعلى واقطفها</small></button>
    <button class="card" style="background:linear-gradient(145deg,#37c8d8,#2a6fd8)" onclick="start('rocks',this)"><i>💎</i>حطّم الصخور<small>اضرب الصخرة بيدك</small></button>
    <button class="card" style="background:linear-gradient(145deg,#b784ff,#ff6fb1)" onclick="start('animals',this)"><i>🐰</i>قلّد الحيوانات<small>اقفز، افرد جناحيك، اجلس</small></button>
    <button class="card" style="background:linear-gradient(145deg,#7fdc5a,#2f9a4a)" onclick="start('hedge',this)"><i>🦔</i>اصطد القنافذ<small>المس القنافذ بيدك</small></button>
    <button class="card" style="background:linear-gradient(145deg,#ffd84d,#7dff9a)" onclick="start('pads',this)"><i>👣</i>ادعس الدوائر<small>ادعس الدائرة المضيئة</small></button>
    <button class="card" style="background:linear-gradient(145deg,#2fd27a,#0f8a5a)" onclick="start('math',this)"><i>🧮</i>غابة الأرقام<small>أجب عن المسألة بحركة يدك</small></button>
    <button class="card" style="background:linear-gradient(145deg,#a58bff,#6a3fd8)" onclick="start('letters',this)"><i>🔤</i>الكرات السحرية<small>اختر الحرف الصحيح بيدك</small></button>
    <button class="card" style="background:linear-gradient(145deg,#59d0ff,#2f7bff)" onclick="start('dragon',this)"><i>🐉</i>طيران التنين<small>حرّك جسمك لتجمع الكرز</small></button>
    <button class="card" style="background:linear-gradient(145deg,#ff8a5c,#ff4f7b)" onclick="start('dance',this)"><i>💃</i>ارقص مع الحيوانات<small>كلما تحركت أكثر رقص أكثر</small></button>
    <button class="card" style="background:linear-gradient(145deg,#4fb7ff,#4a63ff)" onclick="start('copy',this)"><i>🧒</i>قلّد الحركة<small>أعلى، أسفل، يمين، يسار</small></button>
    <button class="card" style="background:linear-gradient(145deg,#47e0a0,#12a58c)" onclick="start('color',this)"><i>🎨</i>أشر إلى اللون<small>أشر إلى الفقاعة الملونة</small></button>
    <button class="card" style="background:linear-gradient(145deg,#ffd23f,#ff9a2e)" onclick="start('balloons',this)"><i>🎈</i>فرقع البالونات<small>المس البالون بيدك</small></button>
    <button class="card" style="background:linear-gradient(145deg,#8fd3ff,#5b8cff)" onclick="start('freeze',this)"><i>🧊</i>ارقص وتجمّد<small>تجمّد عندما تتوقف الموسيقى</small></button>
    <button class="card" style="background:linear-gradient(145deg,#ff9bd2,#9a6bff)" onclick="start('shapes',this)"><i>🔷</i>أين الشكل؟<small>أشر إلى الشكل المطلوب</small></button>
    <button class="card" style="background:linear-gradient(145deg,#ffcf5a,#ff8a3d)" onclick="start('zoo',this)"><i>🦁</i>أين الحيوان؟<small>اختر الحيوان الصحيح بيدك</small></button>
    <button class="card" style="background:linear-gradient(145deg,#4fd6ff,#2a7bd8)" onclick="start('fish',this)"><i>🐟</i>اصطد السمك<small>المس الأسماك السابحة</small></button>
    <button class="card" style="background:linear-gradient(145deg,#8be36a,#2fb58a)" onclick="start('bfly',this)"><i>🦋</i>اصطد الفراشات<small>المس الفراشات الطائرة</small></button>
    <button class="card" style="background:linear-gradient(145deg,#7dff9a,#1fa86a)" onclick="start('jump',this)"><i>🐸</i>قفز الضفدع<small>اقفز عدد المرات المطلوب</small></button>
    <button class="card" style="background:linear-gradient(145deg,#a78bfa,#6d3fd8)" onclick="start('space',this)"><i>🚀</i>مركبات الفضاء<small>المس المركبات الفضائية</small></button>
    <button class="card" style="background:linear-gradient(145deg,#8fd0ff,#5b6be0)" onclick="start('birds',this)"><i>🐦</i>اصطد الطيور<small>المس الطيور المحلّقة</small></button>
    <button class="card" style="background:linear-gradient(145deg,#ffe27a,#c58fd8)" onclick="start('stars',this)"><i>⭐</i>اجمع النجوم<small>المس النجوم المتلألئة</small></button>
  </div>
  <button class="card wide-card" style="background:linear-gradient(145deg,#ff7aa2,#c84bd8)" onclick="studio(1)"><i>🎙️</i>استوديو الصوت<small>سجّل صوت طفل أو أم لكل كلمات اللعبة</small></button>
  <div id="err"></div>
  <p class="tip">💡 ضع الهاتف على حامل ثابت وبشكل أفقي أمام الأطفال بمسافة 2 إلى 3 أمتار. يُنصح بإشراف شخص بالغ.</p>
  </div>
</section>

<div id="hud" hidden>
  <div class="bar glass">
    <button class="ib" onclick="back()">⬅ رجوع</button>
    <b id="ttl"></b>
    <span id="st">⭐ 0</span>
    <span id="tm">30:00</span>
    <span><button class="ib" onclick="viewMode()">📐</button><button class="ib" onclick="flip()">🔄</button></span>

  <div id="pr" class="glass"></div>
  <div id="mt"><i></i></div>
</div>

  <div id="sn"></div><div id="stx"></div><div id="sst"></div>

  <div class="srow"><button class="sb" onclick="snav(-1)">⏮ السابق</button><button class="sb" onclick="snav(1)">⏭ التالي</button></div>

  <p>اقرأ الجملة بصوت واضح. بعد الإيقاف ينتقل تلقائيًا للجملة التالية.</p>
</div></div>

const $=i=>document.getElementById(i);
const cvs=$('c'),g=cvs.getContext('2d'),v=$('v'),an=document.createElement('canvas'),ag=an.getContext('2d',{willReadFrequently:true});
let pm=0,avgB=128,low=false,mode=0,fill=false,SW=0,SH=0,PX=0,PY=0,vk="",camIdx=0,cams=[{f:"user",n:"الكاميرا الأمامية"},{f:"environment",n:"الكاميرا الخلفية"}],W=0,H=0,AW=40,AH=80,age=3,goal=5,game='',run=false,stars=0,stream=null,ac=null,music=false,endT=0,last=0,T=0,S={},startTok=0,tuI=0,wl=null;

const MOV=[['ارفع يديك للأعلى','⬆️','top'],['انزل للأسفل','⬇️','bot'],['تحرّك ناحية اليسار','⬅️','left'],['تحرّك ناحية اليمين','➡️','right'],['اقفز عاليًا','🦘','all']];
const ANI=['🐻','🦁','🐼','🐵','🐶','🦄','🐯','🐸','🐰','🦊'];
const OKW=['أحسنت','أحسنت يا بطل','برافو','ممتاز','مثالي','رائع'];
const TT={dance:'💃 الرقص',copy:'🧒 قلّد الحركة',color:'🎨 أشر إلى اللون',balloons:'🎈 البالونات',freeze:'🧊 تجمّد',math:'🧮 غابة الأرقام',letters:'🔤 الكرات السحرية',dragon:'🐉 طيران التنين',fruit:'🍊 قطف الثمار',rocks:'💎 حطّم الصخور',animals:'🐰 قلّد الحيوانات',hedge:'🦔 القنافذ',pads:'👣 الدوائر',shapes:'🔷 أين الشكل؟',zoo:'🦁 أين الحيوان؟',fish:'🐟 السمك',bfly:'🦋 الفراشات',jump:'🐸 القفز',space:'🚀 الفضاء',birds:'🐦 الطيور',stars:'⭐ النجوم',gmenu:'🖐️ لوّح فوق اللعبة'};
const P4={top:[.5,.25],bot:[.5,.8],left:[.17,.52],right:[.83,.52]};
const rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.random()*a.length|0];

/* رسم إيموجي بظل (بدون صور خارجية: أسرع وتعمل بدون إنترنت) */
function drawImg(name,x,y,size,rot,emoji){

function ln(a,b,c,d,w,col){g.strokeStyle=col;g.lineWidth=w;g.lineCap='round';g.beginPath();g.moveTo(a,b);g.lineTo(c,d);g.stroke()}

function foxChar(x,y,s,pose,t){
  const o='#ff8c42',od='#d95f14',c='#fff1de';
  g.save();g.translate(x,y);
  halo(x,y-s*.2,s*1.6,'#ffb066',.4);
  g.translate(0,0);
  const wig=Math.sin(t/280)*.06;
  // ذيل كبير منفوش
  g.save();g.rotate(-.6+(pose=='right'?.45:pose=='left'?-.2:0)+Math.sin(t/350)*.12);
  g.fillStyle=o;g.beginPath();g.ellipse(-s*.62,-s*.05,s*.55,s*.24,.6,0,6.3);g.fill();
  g.fillStyle=c;g.beginPath();g.ellipse(-s*1,-s*.3,s*.17,s*.11,.6,0,6.3);g.fill();g.restore();
  // الأرجل
  g.fillStyle=od;[-.19,.19].forEach(l=>{g.beginPath();g.ellipse(s*l,s*.66,s*.1,s*.2,0,0,6.3);g.fill()});
  g.fillStyle=c;[-.19,.19].forEach(l=>{g.beginPath();g.ellipse(s*l,s*.78,s*.09,s*.06,0,0,6.3);g.fill()});
  // الجسم
  g.fillStyle=o;g.beginPath();g.ellipse(0,s*.18,s*.35,s*.46,0,0,6.3);g.fill();
  g.fillStyle=c;g.beginPath();g.ellipse(0,s*.32,s*.19,s*.28,0,0,6.3);g.fill();
  // الذراعان حسب الوضعية
  g.strokeStyle=o;g.lineWidth=s*.12;g.lineCap='round';
  const arm=(x1,y1,x2,y2)=>{g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke();g.fillStyle=c;g.beginPath();g.arc(x2,y2,s*.07,0,6.3);g.fill()};
  const hop=pose=='all'?Math.abs(Math.sin(t/220))*s*.18:0;
  g.translate(0,-hop);
  if(pose=='top'){arm(-s*.28,-s*.02,-s*.5,-s*.6);arm(s*.28,-s*.02,s*.5,-s*.6)}
  else if(pose=='left'){arm(-s*.28,0,-s*.68,-s*.12);arm(s*.28,0,s*.56,s*.12)}
  else if(pose=='right'){arm(-s*.28,0,-s*.56,s*.12);arm(s*.28,0,s*.68,-s*.12)}
  else if(pose=='bot'){g.save();g.scale(1.15,.85);arm(-s*.24,s*.05,-s*.44,s*.2);arm(s*.24,s*.05,s*.44,s*.2);g.restore()}
  else{arm(-s*.28,0,-s*.48,s*.22);arm(s*.28,0,s*.48,s*.22)}
  // الرأس
  g.fillStyle=o;g.beginPath();g.arc(0,-s*.42,s*.31,0,6.3);g.fill();
  // الأذنان
  [-1,1].forEach(d=>{g.fillStyle=o;g.beginPath();g.moveTo(d*s*.08,-s*.64);g.lineTo(d*s*.3+wig*d*s*2,-s*.98);g.lineTo(d*s*.36,-s*.56);g.closePath();g.fill();
    g.fillStyle=c;g.beginPath();g.moveTo(d*s*.14,-s*.66);g.lineTo(d*s*.28+wig*d*s*2,-s*.88);g.lineTo(d*s*.31,-s*.62);g.closePath();g.fill()});
  // الوجه
  g.fillStyle=c;g.beginPath();g.ellipse(0,-s*.33,s*.17,s*.13,0,0,6.3);g.fill();
  g.fillStyle='#2a1458';[-1,1].forEach(d=>{g.beginPath();g.arc(d*s*.12,-s*.48,s*.04,0,6.3);g.fill()});
  g.fillStyle='#fff';[-1,1].forEach(d=>{g.beginPath();g.arc(d*s*.12-s*.012,-s*.49,s*.013,0,6.3);g.fill()});
  g.fillStyle='#4a2a2a';g.beginPath();g.arc(0,-s*.4,s*.045,0,6.3);g.fill();
  g.strokeStyle='#4a2a2a';g.lineWidth=s*.022;g.beginPath();g.arc(0,-s*.355,s*.075,.25,2.9);g.stroke();
  g.fillStyle='rgba(255,120,140,.4)';[-1,1].forEach(d=>{g.beginPath();g.arc(d*s*.2,-s*.36,s*.04,0,6.3);g.fill()});
  g.restore()
}
function bigArrow(d,t){

  const ax=W*.7,ay=H*.5;
  g.save();g.translate(ax,ay);g.scale(u,u);g.shadowColor='#ffb300';g.shadowBlur=26;
  g.fillStyle='#ffd23f';g.strokeStyle='#fff';g.lineWidth=7;g.lineJoin='round';
  g.beginPath();
  if(d=='top'||d=='all'){g.moveTo(0,-72);g.lineTo(54,0);g.lineTo(20,0);g.lineTo(20,72);g.lineTo(-20,72);g.lineTo(-20,0);g.lineTo(-54,0)}
  else if(d=='bot'){g.moveTo(0,72);g.lineTo(54,0);g.lineTo(20,0);g.lineTo(20,-72);g.lineTo(-20,-72);g.lineTo(-20,0);g.lineTo(-54,0)}
  else if(d=='left'){g.moveTo(-72,0);g.lineTo(0,-54);g.lineTo(0,-20);g.lineTo(72,-20);g.lineTo(72,20);g.lineTo(0,20);g.lineTo(0,54)}
  else{g.moveTo(72,0);g.lineTo(0,-54);g.lineTo(0,-20);g.lineTo(-72,-20);g.lineTo(-72,20);g.lineTo(0,20);g.lineTo(0,54)}
  g.closePath();g.fill();g.stroke();g.restore();
  if(d=='all'){g.save();g.fillStyle='rgba(255,255,255,.9)';for(let i=0;i<3;i++){const yy=H*.5+90+i*22,sc=1-i*.22;g.globalAlpha=.8-i*.25;g.beginPath();g.ellipse(W*.7,yy,50*sc,10*sc,0,0,6.3);g.fill()}g.restore()}
}

function drawP(){
  g.save();
  for(const p of P){
    p.x+=p.vx;p.y+=p.vy;p.vy+=.18;p.l-=.02;p.rot+=p.vrot;
    g.globalAlpha=Math.max(0,p.l);g.fillStyle=p.c;
    g.save();g.translate(p.x,p.y);g.rotate(p.rot);g.beginPath();
    for(let i=0;i<5;i++){
      g.lineTo(Math.cos((18+i*72)/180*Math.PI)*p.r,-Math.sin((18+i*72)/180*Math.PI)*p.r);
      g.lineTo(Math.cos((54+i*72)/180*Math.PI)*(p.r/2),-Math.sin((54+i*72)/180*Math.PI)*(p.r/2));
    }
    g.closePath();g.fill();g.restore();
  }
  g.restore();P=P.filter(p=>p.l>0)
}

const MV={fish:{e:['🐟','🐠','🐡'],ps:.2,am:5,fl:1,p:'المس السمك بيدك! 🐟'},bfly:{e:['🦋','🐝','🐞'],ps:.3,am:.035,rel:1,p:'المس الفراشات بيدك! 🦋'},space:{e:['🚀','🛸','🛰️'],ps:.15,am:.02,rel:1,p:'المس المركبات الفضائية! 🚀'},birds:{e:['🐦','🕊️','🦜'],ps:.25,am:.03,rel:1,fl:1,p:'المس الطيور بيدك! 🐦'},stars:{e:['⭐','🌟','✨'],ps:.2,am:.02,rel:1,p:'المس النجوم بيدك! ⭐'}};
const SHP=[['الدائرة','●'],['المربع','■'],['المثلث','▲'],['النجمة','★'],['المعين','◆']];
const ZOO=[['الأسد','🦁'],['الفيل','🐘'],['القطة','🐱'],['الأرنب','🐰'],['الحصان','🐴'],['البطة','🦆'],['السمكة','🐟'],['الجمل','🐫']];
function newShape(){const w=pick(SHP);S.q=age==3?{k:'shp',txt:w[1]}:{k:'shp',e:'❓'};const ds=shuffle(SHP.filter(x=>x!==w)).slice(0,3).map(x=>x[1]);setOrbs([w[1]].concat(ds),0);prompt_('أين '+w[0]+'؟',true)}
function newZoo(){const w=pick(ZOO);S.q={k:'zoo',e:'🔍'};const ds=shuffle(ZOO.filter(x=>x!==w)).slice(0,3).map(x=>x[1]);setOrbs([w[1]].concat(ds),0);prompt_('أين '+w[0]+'؟',true)}
function newJump(){S.jt=age==3?3:5;S.jc=0;S.jup=0;S.jl=Date.now();S.t0=Date.now();prompt_('اقفز '+ARW[S.jt]+' مرات!',true)}
const GMI=[['fruit','🍊','قطف الثمار','#ff8a3d'],['rocks','💎','حطّم الصخور','#37c8d8'],['animals','🐰','قلّد الحيوانات','#b784ff'],['hedge','🦔','اصطد القنافذ','#7fdc5a'],['pads','👣','ادعس الدوائر','#ffd84d'],['math','🧮','غابة الأرقام','#2fd27a'],['letters','🔤','الكرات السحرية','#a58bff'],['dragon','🐉','طيران التنين','#59d0ff'],['dance','💃','ارقص مع الحيوانات','#ff8a5c'],['copy','🧒','قلّد الحركة','#4fb7ff'],['color','🎨','أشر إلى اللون','#47e0a0'],['balloons','🎈','فرقع البالونات','#ffd23f'],['freeze','🧊','ارقص وتجمّد','#8fd3ff'],['shapes','🔷','أين الشكل؟','#ff9bd2'],['zoo','🦁','أين الحيوان؟','#ffcf5a'],['fish','🐟','اصطد السمك','#4fd6ff'],['bfly','🦋','اصطد الفراشات','#8be36a'],['jump','🐸','قفز الضفدع','#7dff9a'],['space','🚀','مركبات الفضاء','#a78bfa'],['birds','🐦','اصطد الطيور','#8fd0ff'],['stars','⭐','اجمع النجوم','#ffe27a'],['touch','📱','القائمة العادية','#bbbbbb']];
function initGM(){S.gm=GMI.map(a=>({k:a[0],e:a[1],l:a[2],c:a[3],dw:0,x0:0,y0:0,x1:0,y1:0}));S.gmT=Date.now()+1800;gmLay()}
function gmLay(){if(!S.gm)return;const n=S.gm.length,cols=W>H?8:3,rows=Math.ceil(n/cols),top=Math.max(64,H*.17),pad=8,tw=(W-pad*2)/cols,th=(H-top-pad)/rows;
 S.gm.forEach((o,i)=>{const c=i%cols,r=i/cols|0;o.x0=pad+c*tw+3;o.y0=top+r*th+3;o.x1=pad+(c+1)*tw-3;o.y1=top+(r+1)*th-3})}
function homeZone(){const x=W*.95,y=H*.71,r=Math.min(W,H)*.065;g.save();g.globalAlpha=.85;g.fillStyle='rgba(22,10,53,.65)';g.strokeStyle='#fff';g.lineWidth=3;g.beginPath();g.arc(x,y,r,0,6.3);g.fill();g.stroke();
 if(S.hz>0){g.strokeStyle='#ffd23f';g.lineWidth=6;g.beginPath();g.arc(x,y,r+7,-1.57,-1.57+6.283*Math.min(1,S.hz/28));g.stroke()}g.restore();emo('🏠',x,y,r*1.1)}

function newPad(){S.pd=S.pd==null?1:(S.pd+1+(Math.random()*2|0))%3;S.dw=0;prompt_('ادعس الدائرة المضيئة! 👣',true)}
function newAni(){const sh=()=>[...ANM].sort(()=>Math.random()-.5);if(!S.seq){S.seq=sh();S.ai=0}else{S.ai++;if(S.ai>=4){S.seq=sh();S.ai=0}}S.cur=S.seq[S.ai];S.hold=0;S.sl=0;S.pg=0;S.t0=Date.now();prompt_(S.cur.t,true)}
async function viewMode(){mode=(mode+1)%3;fill=mode==2;try{await cam()}catch(e){}$('pr').textContent=['📐 عرض واسع','📐 عرض كامل للجسم','📐 ملء الشاشة'][mode]}
function timeUp(){S.over=1;let c=10;$('end').hidden=false;$('ep').textContent='سنكمل اللعب تلقائيًا بعد '+c+' ثوانٍ إن لم تختر شيئًا';say('انتهت ثلاثون دقيقة من اللعب. سنكمل تلقائيًا إذا لم تختر شيئًا',true);
 clearInterval(tuI);tuI=setInterval(()=>{c--;$('ep').textContent='سنكمل اللعب تلقائيًا بعد '+c+' ثوانٍ إن لم تختر شيئًا';if(c<=0)extend()},1000)}
function extend(){clearInterval(tuI);$('end').hidden=true;S.end=Date.now()+18e5;S.over=0;say('هيا نكمل اللعب!',true)}

const HI={dance:'هيا نرقص',copy:'هيا نقلّد الحركة',color:'هيا نبحث عن الألوان',balloons:'هيا نفرقع البالونات',freeze:'هيا نرقص ونتجمد',math:'هيا نحل المسائل',letters:'هيا نتعلم الحروف',dragon:'هيا نطير مع التنين',fruit:'هيا نقطف الثمار',rocks:'هيا نحطم الصخور',animals:'هيا نقلد الحيوانات',hedge:'هيا نصطاد القنافذ',pads:'هيا ندعس الدوائر',shapes:'هيا نبحث عن الأشكال',zoo:'هيا نبحث عن الحيوانات',fish:'هيا نصطاد السمك',bfly:'هيا نصطاد الفراشات',jump:'هيا نقفز مثل الضفدع',space:'هيا نصطاد المركبات الفضائية',birds:'هيا نصطاد الطيور',stars:'هيا نجمع النجوم',gmenu:'لوّحوا بأيديكم فوق اللعبة التي تريدونها'};
function allPhrases(){const P=[],a=x=>{x=norm(x);if(x&&P.indexOf(x)<0)P.push(x)};
 Object.keys(HI).forEach(k=>a('مرحبًا يا أبطال! '+HI[k]));OKW.forEach(a);a('حاول مرة أخرى');a('تحرّك أكثر! هيا نرقص');a('تحرّك أكثر!');a('تجمّد! لا تتحرك');
 MOV.forEach(m=>a(m[0]));COL.forEach(c=>{a('أين اللون '+c[0]+'؟ أشر إليه');a('فرقع البالونات '+c[0]);a('اقطف الثمرة ذات اللون '+c[0])});
 a('فرقع البالونات بيدك!');a('كم عدد النجوم؟');for(let i=1;i<6;i++)for(let j=1;j<6;j++)a(ARW[i]+' زائد '+ARW[j]+' يساوي كم؟');
 WRD.forEach(w=>a('ما أول حرف في كلمة '+w[0]+'؟'));a('حرّك جسمك يمينًا ويسارًا لتجمع الكرز!');ARW.slice(1).forEach(a);
 a('مدّ يدك للأعلى واقطف الثمار المضيئة!');a('حطّم الصخور بيدك لتجمع الجواهر!');a('ادعس الدائرة المضيئة!');a('المس القنافذ بيدك!');
 ANM.forEach(m=>a(m.t));SHP.forEach(w=>a('أين '+w[0]+'؟'));ZOO.forEach(w=>a('أين '+w[0]+'؟'));a('المس السمك بيدك!');a('المس الفراشات بيدك!');a('المس المركبات الفضائية!');a('المس الطيور بيدك!');a('المس النجوم بيدك!');a('اقفز '+ARW[3]+' مرات!');a('اقفز '+ARW[5]+' مرات!');a('انتهت ثلاثون دقيقة من اللعب. سنكمل تلقائيًا إذا لم تختر شيئًا');a('هيا نكمل اللعب!');return P}

let SPH=[],si=0,srecR=null,smic=null,sch=[];
function studio(o){$('studio').hidden=!o;if(o){SPH=allPhrases();si=Math.min(si,SPH.length-1);sshow()}else{sstop(true);vstop();if(smic){smic.getTracks().forEach(t=>t.stop());smic=null}}}
function sshow(){const t=SPH[si];$('sn').textContent=(si+1)+' / '+SPH.length+'  •  المسجّل: '+SPH.filter(x=>VB[x]).length;$('stx').textContent=t;$('sst').textContent=VB[t]?'✅ مسجّلة':'⭕ غير مسجّلة (تُقرأ بصوت آلي)'}
function snav(d){sstop(true);si=(si+d+SPH.length)%SPH.length;sshow()}
function sstop(c){if(srecR){srecR.cancel=c;try{srecR.stop()}catch(e){}}}
async function srec(){if(srecR){sstop(false);return}vstop();
 try{smic=smic||await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){$('sst').textContent='اسمح باستخدام الميكروفون لـ Safari';return}
 sch=[];const r=new MediaRecorder(smic);srecR=r;r.ondataavailable=e=>{if(e.data&&e.data.size)sch.push(e.data)};
 r.onstop=async()=>{const t=SPH[si];if(sch.length&&!r.cancel){const b=new Blob(sch,{type:r.mimeType||'audio/mp4'});VB[t]=b;await dbPut(t,b)}srecR=null;$('srec').className='sb';$('srec').textContent='🎙️ سجّل';if(r.cancel)sshow();else snav(1)};
 r.start();$('srec').className='sb rec';$('srec').textContent='⏹ إيقاف';$('sst').textContent='🔴 يسجّل الآن... اقرأ الجملة'}
function splay(){vstop();say(SPH[si])}
async function sdel(){const t=SPH[si];delete VB[t];await dbDel(t);sshow()}

/* حلقة الرسم: تُرسم فقط أثناء اللعب، والتحليل كل ~95ms */
function loop(t){requestAnimationFrame(loop);T=t;if(!$('hud').hidden){if(run&&t-last>95){last=t;try{analyze();tick()}catch(e){console.error(e)}}try{draw(t)}catch(e){console.error(e)}}}
requestAnimationFrame(loop);
</script>
