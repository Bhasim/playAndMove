<!DOCTYPE html>
<!--
  العب وتحرّك - نسخة اللابتوب (3D) - الإصدار 2: رسوميات محسّنة
  - Three.js: إضاءة سينمائية + انعكاسات بيئية + مواد لامعة وفروية
  - MediaPipe Pose: تتبّع الجسم واليدين من بعيد
  - اختياري: ضع نماذج glb للحيوانات في مجلد models بجانب هذا الملف (bunny.glb, fox.glb, panda.glb, bear.glb)
    وستُستخدم تلقائيًا بدل الحيوانات المرسومة بالكود.
-->
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>العب وتحرّك - 3D</title>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#120a2e;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;user-select:none}
[hidden]{display:none!important}
button,select{font:inherit;color:inherit;border:0;cursor:pointer}
#cam{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);z-index:0;background:#120a2e}
#tint{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at center,rgba(60,20,120,.12),rgba(20,5,60,.55))}
#gl,#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#gl{z-index:2}#fx{z-index:3}
.hot{position:relative}
.tile{--c1:#8a5cf0;--c2:#5b8cff;
  background:linear-gradient(90deg,rgba(255,210,63,.8) var(--p,0%),transparent var(--p,0%)),linear-gradient(145deg,var(--c1),var(--c2));
  border:3px solid rgba(255,255,255,.55);border-radius:28px;padding:24px 18px;min-width:210px;font-size:24px;font-weight:900;
  box-shadow:0 8px 0 rgba(0,0,0,.35),0 18px 34px rgba(0,0,0,.35);transition:transform .15s}
.tile i{display:block;font-style:normal;font-size:76px;margin-bottom:8px;filter:drop-shadow(0 6px 6px rgba(0,0,0,.35))}
.tile:hover{transform:translateY(-4px)}
#intro,#menu{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px}
#intro{background:linear-gradient(160deg,#2a1458,#160a35)}
h1{font-size:clamp(38px,6vw,68px);font-weight:900;background:linear-gradient(90deg,#ffd23f,#ff8ac2,#7dd8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:20px;opacity:.95;max-width:720px;line-height:1.7;text-shadow:0 2px 8px rgba(0,0,0,.6)}
#go{background:linear-gradient(145deg,#ff7ab0,#e0449a);padding:18px 46px;border-radius:24px;font-size:26px;font-weight:900;box-shadow:0 7px 0 #a92a6e}
#go:disabled{opacity:.6}
#status{min-height:28px;font-size:17px;color:#ffe08a}
#tiles{display:flex;flex-wrap:wrap;gap:22px;justify-content:center}
#tools{display:flex;gap:12px;align-items:center;margin-top:6px}
#tools select,#tools button{background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.4);padding:10px 16px;border-radius:16px;font-size:16px;font-weight:700;max-width:320px}
#tools select option{color:#000}
#menu{background:rgba(18,8,48,.35)}
#hud{position:fixed;top:0;left:0;right:0;z-index:6;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;pointer-events:none}
#hud>*{pointer-events:auto}
#back{background:linear-gradient(90deg,rgba(255,210,63,.9) var(--p,0%),rgba(255,255,255,.92) var(--p,0%));color:#4a2a9a;font-weight:900;font-size:17px;padding:10px 20px;border-radius:18px;box-shadow:0 4px 0 #b3a3e0}
#score{font-size:26px;font-weight:900;color:#ffd23f;text-shadow:0 2px 0 #b38000,0 4px 12px rgba(0,0,0,.5)}
#title{font-size:18px;font-weight:800;background:rgba(22,10,53,.55);padding:6px 18px;border-radius:16px}
#prompt{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:6;background:rgba(22,10,53,.65);border:2px solid rgba(255,255,255,.7);border-radius:20px;padding:8px 26px;font-size:20px;font-weight:800;white-space:nowrap}
#banner{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;pointer-events:none;font-size:clamp(46px,9vw,110px);font-weight:900;
  -webkit-text-stroke:4px #ff3da6;paint-order:stroke fill;text-shadow:0 8px 0 #4a2a9a,0 16px 34px rgba(0,0,0,.45);
  opacity:0;transform:scale(.4) rotate(-6deg);transition:all .35s cubic-bezier(.175,.885,.32,1.275)}
#banner.on{opacity:1;transform:scale(1) rotate(0)}
</style>
</head>
<body>
<video id="cam" playsinline muted></video>
<div id="tint"></div>
<canvas id="gl"></canvas>
<canvas id="fx"></canvas>

<div id="intro">
  <h1>العب وتحرّك</h1>
  <p class="sub">ضع الكاميرا أمام الأطفال على بعد 2 إلى 3 أمتار بحيث يظهر الجسم كاملًا، واستخدم Chrome. اضغط ابدأ ثم اسمح باستخدام الكاميرا.</p>
  <button id="go">▶ ابدأ</button>
  <div id="status"></div>
</div>

<div id="menu" hidden>
  <h1>العب وتحرّك</h1>
  <p class="sub">🖐️ لوّح بيدك فوق اللعبة التي تريدها لمدة ثانية دون لمس أي شيء</p>
  <div id="tiles">
    <button class="tile hot" data-g="fruit" style="--c1:#ffb347;--c2:#ff6a3d"><i>🍊</i>قطف الثمار</button>
    <button class="tile hot" data-g="balloons" style="--c1:#ffd23f;--c2:#ff9a2e"><i>🎈</i>فرقعة البالونات</button>
    <button class="tile hot" data-g="dance" style="--c1:#ff8a5c;--c2:#ff4f7b"><i>💃</i>ارقص مع الحيوانات</button>
  </div>
  <div id="tools"><select id="camsel" title="الكاميرا"></select><button id="rc">🔄 تحديث الكاميرات</button><button id="fs">⛶ ملء الشاشة</button></div>
  <div id="caminfo" class="sub" style="font-size:15px;min-height:22px"></div>
</div>

<div id="hud" hidden>
  <div id="score">⭐ 0</div>
  <div id="title"></div>
  <button id="back" class="hot">🖐️ لوّح للرجوع</button>
</div>
<div id="prompt" hidden></div>
<div id="banner"></div>
<script type="module">
import * as THREE from 'three';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {clone as skClone} from 'three/addons/utils/SkeletonUtils.js';
import {PoseLandmarker,FilesetResolver} from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs';

const $=id=>document.getElementById(id);
const pick=a=>a[Math.random()*a.length|0];
const WASM='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm';
const MODEL='https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task';
/* نماذج اختيارية (glb). إن لم تُوجد الملفات تُستخدم الحيوانات المرسومة بالكود */
const ASSETS={bunny:'models/bunny.glb',fox:'models/fox.glb',panda:'models/panda.glb',bear:'models/bear.glb'};

/* ================= الصوت ================= */
let ac=null;
function ensureAudio(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch(e){}}
function beep(f,d=.15,ty='triangle'){if(!ac)return;try{const o=ac.createOscillator(),k=ac.createGain();o.type=ty;o.frequency.value=f;k.gain.setValueAtTime(.12,ac.currentTime);k.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(k);k.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
function say(t){try{if(!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}]/gu,''));u.lang='ar-SA';const vs=speechSynthesis.getVoices().filter(v=>v.lang.toLowerCase().startsWith('ar'));if(vs[0])u.voice=vs[0];u.pitch=1.4;u.rate=.9;speechSynthesis.speak(u)}catch(e){}}
function banner(t){const b=$('banner');b.textContent=t;b.className='on';setTimeout(()=>b.className='',1000)}

/* ================= Three.js: المشهد والإضاءة ================= */
const renderer=new THREE.WebGLRenderer({canvas:$('gl'),alpha:true,antialias:true});
renderer.setClearColor(0x000000,0);
renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;
const scene=new THREE.Scene();
/* انعكاسات بيئية ناعمة تعطي المواد مظهرًا واقعيًا */
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,100);
camera.position.set(0,0,12);
scene.add(new THREE.HemisphereLight(0xfff2ff,0x7a5fbf,1.0));
const sun=new THREE.DirectionalLight(0xfff0dd,2.4);sun.position.set(4,7,9);scene.add(sun);
const rim=new THREE.DirectionalLight(0x8fd0ff,1.6);rim.position.set(-6,3,-5);scene.add(rim);

const fx=$('fx'),fg=fx.getContext('2d');
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();fx.width=innerWidth;fx.height=innerHeight}
addEventListener('resize',resize);resize();

/* ===== خامات مرسومة بالكود: توهّج، نجمة، ظل ناعم ===== */
function canvasTex(draw,size=128){const c=document.createElement('canvas');c.width=c.height=size;draw(c.getContext('2d'),size);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t}
const glowTex=canvasTex((g,s)=>{const r=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);r.addColorStop(0,'rgba(255,255,255,1)');r.addColorStop(.35,'rgba(255,255,255,.45)');r.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=r;g.fillRect(0,0,s,s)});
const starTex=canvasTex((g,s)=>{g.translate(s/2,s/2);g.fillStyle='#fff';g.shadowColor='#fff';g.shadowBlur=s*.1;g.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,r=(i%2?.2:.4)*s;g.lineTo(Math.cos(a)*r,Math.sin(a)*r)}g.closePath();g.fill()});
const shadowTex=canvasTex((g,s)=>{const r=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);r.addColorStop(0,'rgba(0,0,0,.6)');r.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=r;g.fillRect(0,0,s,s)});
const spriteCache={};
function spriteMat(tex,c){const k=tex.id+'_'+c;return spriteCache[k]||(spriteCache[k]=new THREE.SpriteMaterial({map:tex,color:c,blending:THREE.AdditiveBlending,depthWrite:false,transparent:true}))}

/* ===== أشكال ومواد مشتركة ===== */
const geo={s:new THREE.SphereGeometry(1,32,24),cyl:new THREE.CylinderGeometry(.5,.5,1,16),cone:new THREE.ConeGeometry(.5,1,16),mouth:new THREE.TorusGeometry(1,.09,8,24,Math.PI)};
const matCache={};
function mat(c,sh=40){const k='m'+c+'_'+sh;return matCache[k]||(matCache[k]=new THREE.MeshStandardMaterial({color:c,roughness:Math.max(.18,Math.min(.9,1-sh/110)),metalness:0,envMapIntensity:.7}))}
function gloss(c){const k='g'+c;return matCache[k]||(matCache[k]=new THREE.MeshPhysicalMaterial({color:c,roughness:.22,metalness:0,clearcoat:1,clearcoatRoughness:.08,envMapIntensity:1.1}))}
function fur(c){const k='f'+c;return matCache[k]||(matCache[k]=new THREE.MeshPhysicalMaterial({color:c,roughness:.82,sheen:1,sheenRoughness:.45,sheenColor:new THREE.Color(0xffffff),envMapIntensity:.5}))}
function basic(c,op=1){const k='b'+c+'_'+op;return matCache[k]||(matCache[k]=new THREE.MeshBasicMaterial({color:c,transparent:op<1,opacity:op,depthWrite:op>=1}))}
function mesh(g,c,x,y,z,sx=1,sy=1,sz=1,sh=40){const m=new THREE.Mesh(g,typeof c==='number'?mat(c,sh):c);m.position.set(x,y,z);m.scale.set(sx,sy,sz);return m}

const DEG=Math.PI/180;
function halfH(z){return Math.tan(camera.fov/2*DEG)*(camera.position.z-z)}
function place(nx,ny,z){const hh=halfH(z);return new THREE.Vector3(nx*hh*camera.aspect,ny*hh,z)}
function pxPerUnit(z){return innerHeight/(2*halfH(z))}
const v3=new THREE.Vector3();
function toScreen(o){o.getWorldPosition(v3);v3.project(camera);return{x:(v3.x*.5+.5)*innerWidth,y:(-v3.y*.5+.5)*innerHeight}}

/* ===== غبار نجمي متلألئ في الخلفية ===== */
const SP_N=90,spPos=new Float32Array(SP_N*3),spCol=new Float32Array(SP_N*3),spV=[];
for(let i=0;i<SP_N;i++){spPos[i*3]=(Math.random()-.5)*28;spPos[i*3+1]=(Math.random()-.5)*15;spPos[i*3+2]=-3+Math.random()*5;const c=new THREE.Color().setHSL(Math.random(),.8,.75);spCol.set([c.r,c.g,c.b],i*3);spV.push(.2+Math.random()*.5)}
const sg=new THREE.BufferGeometry();sg.setAttribute('position',new THREE.BufferAttribute(spPos,3));sg.setAttribute('color',new THREE.BufferAttribute(spCol,3));
scene.add(new THREE.Points(sg,new THREE.PointsMaterial({map:glowTex,size:.6,transparent:true,opacity:.85,depthWrite:false,blending:THREE.AdditiveBlending,vertexColors:true})));
function updateSparkles(dt,t){for(let i=0;i<SP_N;i++){spPos[i*3+1]+=spV[i]*dt;if(spPos[i*3+1]>7.5)spPos[i*3+1]=-7.5;spPos[i*3]+=Math.sin(t+i)*dt*.25}sg.attributes.position.needsUpdate=true}

/* ===== جزيئات الاحتفال (نجوم ولمعان) ===== */
const parts=[];
function burst(pos,cols,n=16,sp=5){
  for(let i=0;i<n;i++){
    const star=Math.random()<.55,s=new THREE.Sprite(spriteMat(star?starTex:glowTex,pick(cols))),sz=(star?.4:.55)*(.6+Math.random()*.8),a=Math.random()*6.28,k=sp*(.4+Math.random());
    s.position.copy(pos);s.scale.setScalar(sz);scene.add(s);
    parts.push({m:s,vx:Math.cos(a)*k,vy:Math.sin(a)*k+2,vz:(Math.random()-.5)*3,l:1,s:sz});
  }
}
function updateParts(dt){for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.l-=dt*1.1;p.vy-=8*dt;p.m.position.x+=p.vx*dt;p.m.position.y+=p.vy*dt;p.m.position.z+=p.vz*dt;p.m.scale.setScalar(Math.max(.001,p.s*p.l));if(p.l<=0){scene.remove(p.m);parts.splice(i,1)}}}
function clearParts(){parts.forEach(p=>scene.remove(p.m));parts.length=0}

/* ================= الكاميرا والتتبّع ================= */
const cam=$('cam');
let stream=null,lm=null,fileset=null,cpuMode=false,detErr=0;
async function startCam(deviceId){
  if(stream)stream.getTracks().forEach(t=>t.stop());
  const v={width:{ideal:1280},height:{ideal:720},frameRate:{ideal:30}};
  if(deviceId)v.deviceId={exact:deviceId};
  stream=await navigator.mediaDevices.getUserMedia({video:v,audio:false});
  cam.srcObject=stream;await cam.play();
}
async function fillCams(){
  const ds=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput');
  const sel=$('camsel');sel.innerHTML='';
  ds.forEach((d,i)=>{const o=document.createElement('option');o.value=d.deviceId;o.textContent='📷 '+(d.label||('كاميرا '+(i+1)));sel.appendChild(o)});
  let cur=stream&&stream.getVideoTracks()[0]?stream.getVideoTracks()[0].getSettings().deviceId:null;
  const internal=/facetime|built-?in|isight|مدمج/i,curD=ds.find(d=>d.deviceId===cur);
  if(ds.length>1&&curD&&internal.test(curD.label)){
    const ext=ds.find(d=>!internal.test(d.label));
    if(ext){try{await startCam(ext.deviceId);cur=ext.deviceId}catch(e){try{await startCam(cur)}catch(_){}$('caminfo').textContent='تعذّر فتح الكاميرا الخارجية: '+(e.name||e.message)+' (قد تكون مستخدمة من برنامج آخر)'}}
  }
  if(cur)sel.value=cur;
  const info=$('caminfo');
  if(!info.textContent.startsWith('تعذّر'))info.textContent='الكاميرات المكتشفة: '+ds.length+(ds.length<2?' — لم يرَ المتصفح الكاميرا الخارجية. تأكد من توصيلها ومن إذن Chrome في إعدادات الخصوصية، ثم اضغط تحديث.':'');
}
$('camsel').onchange=async e=>{const prev=stream&&stream.getVideoTracks()[0]?stream.getVideoTracks()[0].getSettings().deviceId:null;try{await startCam(e.target.value);$('caminfo').textContent=''}catch(err){if(prev){try{await startCam(prev);e.target.value=prev}catch(_){}}$('caminfo').textContent='تعذّر فتح هذه الكاميرا: '+(err.name||err.message)+' (قد تكون مستخدمة من برنامج آخر)'}};
$('rc').onclick=()=>{$('caminfo').textContent='';fillCams().catch(console.error)};
if(navigator.mediaDevices&&navigator.mediaDevices.addEventListener)navigator.mediaDevices.addEventListener('devicechange',()=>{if(stream){$('caminfo').textContent='';fillCams().catch(console.error)}});
$('fs').onclick=()=>{const d=document.documentElement;if(document.fullscreenElement)document.exitFullscreen();else (d.requestFullscreen||d.webkitRequestFullscreen).call(d)};

function mkLm(d){return PoseLandmarker.createFromOptions(fileset,{baseOptions:{modelAssetPath:MODEL,delegate:d},runningMode:'VIDEO',numPoses:2,minPoseDetectionConfidence:.4,minPosePresenceConfidence:.4,minTrackingConfidence:.4})}
async function loadLm(){fileset=await FilesetResolver.forVisionTasks(WASM);try{lm=await mkLm('GPU')}catch(e){cpuMode=true;lm=await mkLm('CPU')}}

/* نماذج glb اختيارية */
const MODELS={};
async function loadModels(){const L=new GLTFLoader();await Promise.all(Object.entries(ASSETS).map(async([k,u])=>{try{MODELS[k]=await L.loadAsync(u)}catch(e){}}))}

function mapPt(p){const vw=cam.videoWidth||16,vh=cam.videoHeight||9,sc=Math.max(innerWidth/vw,innerHeight/vh),dw=vw*sc,dh=vh*sc;return{x:(innerWidth-dw)/2+(1-p.x)*dw,y:(innerHeight-dh)/2+p.y*dh}}
const BODY=[0,11,12,13,14,15,16,23,24];
let pts=[],ptsT=0,energy=0,lastDet=0,lastVT=-1,prevT=0,prevBody=[],mouse=null,cp=[];
addEventListener('pointermove',e=>{mouse={x:e.clientX,y:e.clientY,t:performance.now()}});

function detect(now){
  if(!lm||cam.readyState<2||now-lastDet<40||cam.currentTime===lastVT)return;
  lastDet=now;lastVT=cam.currentTime;
  let res;
  try{res=lm.detectForVideo(cam,now)}
  catch(e){if(++detErr===5&&!cpuMode){cpuMode=true;lm=null;mkLm('CPU').then(x=>{lm=x}).catch(console.error)}return}
  const dts=Math.max(.02,(now-prevT)/1000);prevT=now;
  const np=[],poses=res.landmarks||[];let tot=0,cnt=0;
  poses.forEach((l,pi)=>{
    for(const i of [15,16,19,20]){const p=l[i];if(p&&(p.visibility==null||p.visibility>.35))np.push(mapPt(p))}
    const cur=BODY.map(i=>l[i]),pr=prevBody[pi];
    if(pr)for(let k=0;k<cur.length;k++){tot+=Math.hypot(cur[k].x-pr[k].x,cur[k].y-pr[k].y);cnt++}
    prevBody[pi]=cur.map(p=>({x:p.x,y:p.y}));
  });
  prevBody.length=poses.length;
  const target=cnt?Math.min(1,(tot/cnt)/dts/.7):0;
  energy+=(target-energy)*.35;
  if(np.length){pts=np;ptsT=now}else if(now-ptsT>250)pts=[];
}

/* ================= أهداف التلويح ================= */
let hot=[],lockUntil=0;
function setHot(list){hot=list.map(h=>({...h,t:0}));lockUntil=performance.now()+1200}
function updateHot(dt,now){
  for(const h of hot){
    if(now<lockUntil){h.t=0;h.el.style.setProperty('--p','0%');continue}
    const r=h.el.getBoundingClientRect(),m=14;let inside=false;
    for(const p of cp)if(p.x>=r.left-m&&p.x<=r.right+m&&p.y>=r.top-m&&p.y<=r.bottom+m){inside=true;break}
    h.t=inside?h.t+dt:Math.max(0,h.t-dt*2);
    h.el.style.setProperty('--p',Math.min(100,h.t/h.need*100)+'%');
    if(h.t>=h.need){h.t=0;beep(880);h.fn();break}
  }
}

/* ================= رسم المؤشرات والحلقات ================= */
const rings=[];
function ring(x,y,r,p){rings.push({x,y,r,p:Math.min(1,p)})}
function drawFx(){
  fg.clearRect(0,0,fx.width,fx.height);
  for(const r of rings){
    fg.lineCap='round';fg.lineWidth=11;fg.strokeStyle='rgba(0,0,0,.25)';fg.beginPath();fg.arc(r.x,r.y,r.r,0,6.3);fg.stroke();
    fg.lineWidth=8;fg.strokeStyle='#ffd23f';fg.shadowColor='#ffb300';fg.shadowBlur=14;fg.beginPath();fg.arc(r.x,r.y,r.r,-Math.PI/2,-Math.PI/2+Math.PI*2*r.p);fg.stroke();fg.shadowBlur=0;
  }
  rings.length=0;
  for(const p of cp){
    const g=fg.createRadialGradient(p.x,p.y,2,p.x,p.y,26);
    g.addColorStop(0,'rgba(255,255,255,.95)');g.addColorStop(.5,'rgba(125,216,255,.6)');g.addColorStop(1,'rgba(125,216,255,0)');
    fg.fillStyle=g;fg.beginPath();fg.arc(p.x,p.y,26,0,6.3);fg.fill();
  }
}

/* ================= الحيوانات المجسّمة (أسلوب كرتوني ناعم) ================= */
function eye(sx,y,z){
  const e=new THREE.Group();e.position.set(sx*.4,y,z);
  e.add(mesh(geo.s,mat(0x1a1020,100),0,0,0,.17,.21,.1));
  e.add(mesh(geo.s,basic(0xffffff),.05,.075,.085,.065,.065,.03));
  e.add(mesh(geo.s,basic(0xffffff),-.05,-.07,.085,.03,.03,.02));
  return e;
}
function makeAnimal(type){
  if(MODELS[type])return makeFromModel(MODELS[type]);
  const P={bunny:[0xffffff,0xffffff,0xffe3ec],fox:[0xff8a2b,0x6b3a1e,0xfff6ea],panda:[0xffffff,0x242424,0xffffff],bear:[0xc47a3d,0x8a5226,0xf2d3a5]}[type];
  const fm=fur(P[0]),dm=fur(P[1]),lm_=fur(P[2]),pink=fur(0xffa3bd);
  const g=new THREE.Group(),body=new THREE.Group(),head=new THREE.Group();
  g.add(body);g.add(head);head.position.y=.35;
  /* الجسم */
  body.add(mesh(geo.s,fm,0,-1.35,0,.88,.98,.75));
  body.add(mesh(geo.s,lm_,0,-1.3,.5,.55,.7,.3));
  for(const sx of [-1,1])body.add(mesh(geo.s,type==='bunny'?fm:dm,sx*.45,-2.25,.2,type==='bunny'?.4:.36,.22,type==='bunny'?.55:.45));
  g.userData.arms=[];
  for(const sx of [-1,1]){
    const piv=new THREE.Group();piv.position.set(sx*.82,-.9,0);piv.userData.sx=sx;
    piv.add(mesh(geo.s,type==='panda'||type==='fox'?dm:fm,0,-.5,0,.25,.55,.25));
    body.add(piv);g.userData.arms.push(piv);
  }
  if(type==='bunny')body.add(mesh(geo.s,fur(0xffffff),0,-1.75,-.75,.3,.3,.3));
  if(type==='fox'){
    const tg=new THREE.Group();tg.position.set(.55,-1.9,-.4);tg.rotation.z=-1.0;
    tg.add(mesh(geo.s,fm,0,.6,0,.38,.85,.38));tg.add(mesh(geo.s,lm_,0,1.3,0,.3,.3,.3));
    body.add(tg);g.userData.tail=tg;
  }
  /* الرأس */
  head.add(mesh(geo.s,fm,0,.2,0,1.12,1.0,1.0));
  const nose=(y,z,c)=>head.add(mesh(geo.s,c,0,y,z,.13,.09,.09,90));
  let mz=.99,my=-.08;
  if(type==='fox'){
    head.add(mesh(geo.s,lm_,0,-.1,.8,.42,.3,.35));
    for(const sx of [-1,1])head.add(mesh(geo.s,lm_,sx*.78,0,.4,.36,.28,.3));
    nose(.02,1.12,mat(0x1a1020,100));mz=1.13;my=-.2;
  }else if(type==='bear'){
    head.add(mesh(geo.s,lm_,0,-.08,.88,.38,.28,.2));
    nose(.1,1.06,mat(0x1a1020,100));mz=1.07;my=-.02;
  }else if(type==='panda'){
    for(const sx of [-1,1]){const p=mesh(geo.s,dm,sx*.44,.3,.84,.24,.32,.12);p.rotation.z=sx*.4;head.add(p)}
    nose(.1,.99,mat(0x1a1020,100));
  }else{
    head.add(mesh(geo.s,lm_,0,-.05,.9,.3,.22,.14));
    nose(.1,.99,pink);
  }
  for(const sx of [-1,1]){
    head.add(eye(sx,.38,.86));
    if(type!=='fox')head.add(mesh(geo.s,basic(0xff8fb1,.55),sx*.72,0,.7,.2,.12,.06));
    /* الأذنان */
    if(type==='bunny'){
      const e=new THREE.Group();e.position.set(sx*.45,.95,-.05);e.rotation.z=-sx*.18;
      e.add(mesh(geo.s,fm,0,.7,0,.22,.85,.14));e.add(mesh(geo.s,pink,0,.7,.06,.12,.65,.07));head.add(e);
    }else if(type==='fox'){
      const e=mesh(geo.cone,fm,sx*.58,1.1,0,.6,.95,.3);e.rotation.z=-sx*.25;head.add(e);
      const i2=mesh(geo.cone,dm,sx*.58,1.08,.08,.32,.6,.15);i2.rotation.z=-sx*.25;head.add(i2);
    }else{
      head.add(mesh(geo.s,dm,sx*.8,.95,-.05,.3,.3,.2));
      if(type==='bear')head.add(mesh(geo.s,fur(0xd9936a),sx*.8,.95,.1,.17,.17,.08));
    }
  }
  const mo=mesh(geo.mouth,basic(0x4a2a2a),0,my,mz,.16,.16,.16);mo.rotation.z=Math.PI;head.add(mo);
  g.userData.head=head;g.userData.body=body;
  return g;
}
function makeFromModel(mdl){
  const g=new THREE.Group(),root=skClone(mdl.scene);g.add(root);g.updateMatrixWorld(true);
  let b=new THREE.Box3().setFromObject(root);const sz=b.getSize(new THREE.Vector3());
  root.scale.multiplyScalar(4.6/Math.max(.001,sz.y));g.updateMatrixWorld(true);
  b.setFromObject(root);const c=b.getCenter(new THREE.Vector3());
  root.position.x-=c.x;root.position.z-=c.z;root.position.y+=-2.3-b.min.y;
  g.userData.arms=[];
  if(mdl.animations&&mdl.animations.length){
    const mx=new THREE.AnimationMixer(root),clip=mdl.animations.find(a=>/dance|idle|walk|run|gallop|jump/i.test(a.name))||mdl.animations[0];
    mx.clipAction(clip).play();g.userData.mixer=mx;
  }
  return g;
}

/* ================= الألعاب ================= */
let G=null,cur=null,curName='',score=0,T=0;
const S={};
function ok(){score++;$('score').textContent='⭐ '+score;[660,880,1175].forEach((f,i)=>setTimeout(()=>beep(f),i*90));banner(pick(['أحسنت! 🌟','برافو! 🎉','رائع! 👏']));say(pick(['أحسنت','برافو','ممتاز','رائع']))}

const BAL=[0xff4d5e,0xffd23f,0x3d8bff,0x38c172,0xff9a2e,0xc84bd8,0xff5fa2];
const ANIMALS=['bunny','fox','panda','bear'];

const games={
  fruit:{title:'🍊 قطف الثمار',prompt:'مدّ يدك واقطف الثمار!',
    init(){
      S.items=[];const xs=[-.72,-.36,0,.36,.72],ys=[.45,.58,.4,.58,.45];
      /* أوراق شجر في الأعلى */
      for(let i=0;i<26;i++){const l=mesh(geo.s,mat(pick([0x2fb15f,0x1f8a4c,0x52c878,0x38c172]),50),0,0,0,.55,.17,.12);l.position.copy(place(-1.1+i*.085,1.02+Math.random()*.08,-.6+Math.random()*1.2));l.rotation.z=(Math.random()-.5)*1.4;G.add(l)}
      xs.forEach((nx,i)=>{
        const g=new THREE.Group(),base=place(nx,ys[i],0),L=Math.max(.5,place(0,1.4,0).y-base.y-.9);
        const gl=new THREE.Sprite(spriteMat(glowTex,0xffb347));gl.scale.setScalar(3.6);gl.position.z=-.6;g.add(gl);
        g.add(mesh(geo.s,gloss(0xff8c1a),0,0,0,.8,.76,.8));
        const leaf=mesh(geo.s,mat(0x3aa04a,60),.28,.8,0,.3,.07,.17);leaf.rotation.z=.5;g.add(leaf);
        g.add(mesh(geo.cyl,0x6b4a1e,0,.8,0,.07,.25,.07));
        g.add(mesh(geo.cyl,0x3c9a4a,0,.9+L/2,0,.06,L,.06));
        g.position.copy(base);G.add(g);
        S.items.push({g,base,dw:0,alive:true,rs:0,ph:Math.random()*6,sc:1});
      });
    },
    update(dt,t){
      const R=pxPerUnit(0)*.8*1.5;
      for(const it of S.items){
        if(!it.alive){it.rs-=dt;if(it.rs<=0){it.alive=true;it.g.visible=true;it.sc=.01;it.g.scale.setScalar(.01)}continue}
        if(it.sc<1){it.sc=Math.min(1,it.sc+dt*2.5);it.g.scale.setScalar(it.sc)}
        it.g.position.y=it.base.y+Math.sin(t*1.6+it.ph)*.12;it.g.rotation.y=Math.sin(t+it.ph)*.4;
        const sp=toScreen(it.g);let inn=false;
        for(const p of cp)if(Math.hypot(p.x-sp.x,p.y-sp.y)<R){inn=true;break}
        it.dw=inn?it.dw+dt:Math.max(0,it.dw-dt*1.5);
        if(it.dw>0)ring(sp.x,sp.y,R*.8,it.dw/.3);
        if(it.dw>=.3){it.dw=0;it.alive=false;it.g.visible=false;it.rs=1.4;burst(it.g.position,[0xffa63d,0xffd23f,0xff6a3d,0xfff1a8],20,5);ok()}
      }
    }},

  balloons:{title:'🎈 فرقعة البالونات',prompt:'المس البالونات بيدك!',
    init(){S.b=[];S.sp=0},
    update(dt,t){
      S.sp-=dt;
      if(S.sp<=0){
        S.sp=.9;const r=.8+Math.random()*.35,col=pick(BAL),z=-1+Math.random()*2.5,base=place(-.85+Math.random()*1.7,-1.4,z);
        const g=new THREE.Group();
        g.add(mesh(geo.s,gloss(col),0,0,0,r,r*1.18,r));
        g.add(mesh(geo.s,basic(0xffffff,.85),-r*.38,r*.5,r*.8,r*.15,r*.28,r*.08));
        g.add(mesh(geo.cone,gloss(col),0,-r*1.22,0,r*.2,r*.28,r*.2));
        g.add(mesh(geo.cyl,0xffffff,0,-r*1.3-1,0,.03,2,.03,10));
        g.position.copy(base);G.add(g);
        S.b.push({g,x0:base.x,r,col,v:1.6+Math.random()*.9,ph:Math.random()*6});
      }
      const topY=place(0,1,0).y;
      for(let i=S.b.length-1;i>=0;i--){
        const b=S.b[i];b.g.position.y+=b.v*dt;b.g.position.x=b.x0+Math.sin(t*1.3+b.ph)*.35;b.g.rotation.z=Math.sin(t*1.3+b.ph)*.12;
        const sp=toScreen(b.g),R=pxPerUnit(b.g.position.z)*b.r*1.25;let hit=false;
        for(const p of cp)if(Math.hypot(p.x-sp.x,p.y-sp.y)<R){hit=true;break}
        if(hit){burst(b.g.position,[b.col,0xffffff,0xffd23f],20,5);G.remove(b.g);S.b.splice(i,1);ok()}
        else if(b.g.position.y>topY+3.5){G.remove(b.g);S.b.splice(i,1)}
      }
    }},

  dance:{title:'💃 ارقص مع الحيوانات',prompt:'تحرّك وارقص!',
    init(){
      S.type=0;S.prog=0;S.idle=0;S.base=place(0,-.05,0);
      /* منصة رقص متوهّجة */
      const st=new THREE.Group();st.position.set(S.base.x,S.base.y-2.3,0);st.rotation.x=-1.1;
      st.add(mesh(new THREE.CircleGeometry(3.4,56),basic(0x6a3fd8,.5),0,0,-.02));
      S.rim=mesh(new THREE.TorusGeometry(3.4,.08,8,72),basic(0xff5fa2),0,0,0);st.add(S.rim);
      S.rim2=mesh(new THREE.TorusGeometry(2.3,.05,8,72),basic(0x7dd8ff),0,0,0);st.add(S.rim2);
      S.shadow=new THREE.Mesh(new THREE.PlaneGeometry(3.6,3.6),new THREE.MeshBasicMaterial({map:shadowTex,transparent:true,depthWrite:false}));S.shadow.position.z=.02;st.add(S.shadow);
      G.add(st);S.stage=st;
      /* أضواء ملوّنة خلف الحيوان */
      S.l1=new THREE.Sprite(spriteMat(glowTex,0xff5fa2));S.l1.scale.setScalar(9);S.l1.position.set(S.base.x-3,S.base.y+.5,-2);G.add(S.l1);
      S.l2=new THREE.Sprite(spriteMat(glowTex,0x4fb7ff));S.l2.scale.setScalar(9);S.l2.position.set(S.base.x+3,S.base.y+.5,-2);G.add(S.l2);
      S.an=makeAnimal(ANIMALS[0]);S.an.position.copy(S.base);G.add(S.an);
    },
    update(dt,t){
      const e=energy,a=S.an,u=a.userData,hop=Math.abs(Math.sin(t*7))*e*.9;
      a.position.y=S.base.y+hop;
      a.rotation.z=Math.sin(t*5)*(.04+e*.3);a.rotation.y=Math.sin(t*3)*(.15+e*.5);
      if(u.body){const sq=1+Math.sin(t*14)*.03*(.3+e);u.body.scale.set(1/Math.sqrt(sq),sq,1/Math.sqrt(sq))}
      if(u.head){u.head.rotation.z=Math.sin(t*4)*(.06+e*.18);u.head.position.y=.35+Math.sin(t*8)*.05*(.3+e)}
      if(u.tail)u.tail.rotation.z=-1.0+Math.sin(t*9)*.25*(.4+e);
      u.arms.forEach(p=>{p.rotation.z=p.userData.sx*(.35+Math.abs(Math.sin(t*8+p.userData.sx))*e*2.3)});
      if(u.mixer)u.mixer.update(dt*(.5+e*2.5));
      /* منصة وأضواء */
      S.rim.material.color.setHSL((t*.2)%1,.8,.6);S.rim2.material.color.setHSL((t*.2+.5)%1,.8,.65);
      S.shadow.scale.setScalar(1-Math.min(.35,hop*.3));
      S.l1.material.opacity=1;S.l1.position.x=S.base.x-3+Math.sin(t*1.2)*1.5;S.l2.position.x=S.base.x+3+Math.sin(t*1.2+3)*1.5;
      /* التقدّم */
      S.prog+=Math.max(0,e-.2)*dt*.5;
      S.idle=e<.2?S.idle+dt:0;
      if(S.idle>8){S.idle=0;say('تحرّك وارقص')}
      const sp=toScreen(a);ring(sp.x,sp.y,pxPerUnit(0)*3.1,S.prog);
      if(S.prog>=1){
        S.prog=0;burst(a.position,[0xffd23f,0xff5fa2,0x46e0a0,0x4fb7ff,0xffffff],34,6);ok();
        G.remove(a);S.type=(S.type+1)%ANIMALS.length;S.an=makeAnimal(ANIMALS[S.type]);S.an.position.copy(S.base);G.add(S.an);
      }
    }}
};

function startGame(name){
  curName=name;cur=games[name];score=0;$('score').textContent='⭐ 0';
  if(G)scene.remove(G);G=new THREE.Group();scene.add(G);clearParts();
  cur.init();
  $('title').textContent=cur.title;$('prompt').textContent=cur.prompt;
  show('game');say(cur.prompt);
}
function exitGame(){cur=null;if(G){scene.remove(G);G=null}clearParts();show('menu')}

/* ================= الشاشات ================= */
function show(state){
  $('intro').hidden=state!=='intro';$('menu').hidden=state!=='menu';
  $('hud').hidden=state!=='game';$('prompt').hidden=state!=='game';
  if(state==='menu')setHot([...document.querySelectorAll('.tile')].map(el=>({el,need:1,fn:()=>startGame(el.dataset.g)})));
  else if(state==='game')setHot([{el:$('back'),need:.8,fn:exitGame}]);
  else setHot([]);
}
document.querySelectorAll('.tile').forEach(el=>el.addEventListener('click',()=>{ensureAudio();startGame(el.dataset.g)}));
$('back').addEventListener('click',exitGame);
addEventListener('keydown',e=>{if(e.key==='Escape'&&cur)exitGame()});

$('go').onclick=async()=>{
  const st=$('status'),btn=$('go');btn.disabled=true;
  try{
    ensureAudio();
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('افتح الصفحة عبر رابط https (مثل GitHub Pages)');
    st.textContent='جاري فتح الكاميرا...';
    await startCam();await fillCams();
    st.textContent='جاري تحميل نموذج التتبّع (أول مرة قد يستغرق دقيقة)...';
    await loadLm();
    st.textContent='جاري تجهيز الشخصيات...';
    await loadModels();
    show('menu');
  }catch(e){
    st.textContent='تعذّر البدء: '+((e&&(e.message||e.name))||e);
    btn.disabled=false;
  }
};

/* ================= الحلقة الرئيسية ================= */
let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;
  detect(now);
  cp=pts.slice();if(mouse&&now-mouse.t<2500)cp.push(mouse);
  if(cur)cur.update(dt,T);
  updateSparkles(dt,T);updateParts(dt);updateHot(dt,now);
  renderer.render(scene,camera);drawFx();
}
show('intro');
requestAnimationFrame(frame);
</script>
