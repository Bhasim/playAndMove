<style>
  :root{ --ink:#fff; --pill:rgba(20,12,60,.55); }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#0b0620;
    font-family:'Tajawal', 'Segoe UI', Tahoma, sans-serif; color:var(--ink); }
  #cam{ position:fixed; inset:0; width:100vw; height:100vh; object-fit:cover;
    transform:scaleX(-1); background:#123; z-index:0; }
  #stage{ position:fixed; inset:0; z-index:1; pointer-events:none; }
  #stage canvas{ display:block; }
  #vignette{ position:fixed; inset:0; z-index:2; pointer-events:none;
    background:radial-gradient(ellipse at center, transparent 52%, rgba(10,4,40,.55) 100%); }
  .hud{ position:fixed; z-index:5; pointer-events:none; user-select:none; }

  #stars{ top:14px; left:14px; background:var(--pill); border-radius:999px; padding:8px 22px;
    font-size:34px; font-weight:800; display:flex; gap:10px; align-items:center;
    border:2px solid rgba(255,215,80,.65); box-shadow:0 4px 18px rgba(0,0,0,.35); }
  #stars .s{ color:#ffd54a; text-shadow:0 0 14px #ffb300; }
  #timer{ top:16px; left:50%; transform:translateX(-50%); background:var(--pill);

  #question{ top:84px; left:50%; transform:translateX(-50%); background:var(--pill);
    border-radius:28px; padding:10px 34px; font-size:44px; font-weight:800;
    border:3px solid rgba(255,255,255,.35); display:none; text-shadow:0 2px 8px rgba(0,0,0,.5); }
  #praise{ top:38%; left:50%; transform:translate(-50%,-50%) scale(0); font-size:110px;
    font-weight:800; color:#ffe95e; -webkit-text-stroke:3px #b34d00;

  #praise.pop{ animation:praisePop 1.1s ease-out forwards; }
  @keyframes praisePop{ 0%{transform:translate(-50%,-50%) scale(0);opacity:0;}
    18%{transform:translate(-50%,-50%) scale(1.25);opacity:1;}
    35%{transform:translate(-50%,-50%) scale(1);opacity:1;}
    80%{opacity:1;} 100%{transform:translate(-50%,-58%) scale(1);opacity:0;} }

  #backzone{ top:12px; right:12px; width:190px; height:96px; border-radius:26px;
    background:var(--pill); border:3px solid rgba(255,255,255,.5); display:none;

    pointer-events:none; overflow:hidden; }
  #backzone .fill{ position:absolute; bottom:0; left:0; width:100%; height:0%;

  #backzone span{ position:relative; }

  #dwell{ width:96px; height:96px; border-radius:50%; margin:-48px 0 0 -48px; display:none;
    background:conic-gradient(#7dffb0 calc(var(--p)*360deg), rgba(255,255,255,.18) 0deg);
    -webkit-mask:radial-gradient(circle, transparent 58%, #000 60%);
            mask:radial-gradient(circle, transparent 58%, #000 60%); }

  #energywrap{ bottom:18px; left:50%; transform:translateX(-50%); width:min(560px,70vw); height:30px;

  #topbar{ top:14px; right:220px; display:flex; gap:10px; pointer-events:auto; z-index:8; }
  #topbar select, #topbar button{ font-family:inherit; font-size:18px; font-weight:700;

  #menu{ position:fixed; inset:0; z-index:6; display:none; flex-direction:column;
    align-items:center; justify-content:center; gap:18px; padding:90px 4vw 30px;
    background:radial-gradient(ellipse at center, rgba(30,10,80,.25), rgba(10,4,40,.72)); }
  #menu h1{ margin:0; font-size:min(64px,7vw); font-weight:800; color:#fff;
    text-shadow:0 0 26px #8f6bff, 0 4px 0 rgba(0,0,0,.35); }

  #tiles{ display:grid; grid-template-columns:repeat(4, minmax(150px, 240px)); gap:20px; }
  @media (max-width:900px){ #tiles{ grid-template-columns:repeat(2, minmax(140px,1fr)); } }
  .tile{ position:relative; border-radius:26px; padding:20px 12px 16px; text-align:center;

  .tile:hover{ transform:scale(1.05); }
  .tile .ic{ font-size:56px; line-height:1.1; filter:drop-shadow(0 4px 6px rgba(0,0,0,.35)); }
  .tile .tt{ font-size:24px; font-weight:800; margin-top:6px; text-shadow:0 2px 6px rgba(0,0,0,.5); }

  #startoverlay{ position:fixed; inset:0; z-index:20; display:flex; flex-direction:column;

  #startoverlay h1{ font-size:min(58px,8vw); margin:0; color:#ffe95e;
    text-shadow:0 0 30px #8f6bff; }
  #status{ font-size:24px; font-weight:700; min-height:34px; }
  #startbtn{ font-family:inherit; font-size:34px; font-weight:800; color:#3a1d00;
    background:linear-gradient(180deg,#ffe95e,#ffb300); border:none; border-radius:999px;

    display:none; }
  #startbtn:active{ transform:translateY(4px); box-shadow:0 4px 0 #b36a00; }
  #err{ display:none; max-width:720px; background:rgba(120,0,40,.75); border:2px solid #ff6b9d;
    border-radius:18px; padding:18px 26px; font-size:22px; font-weight:700; line-height:1.7; }
  .spin{ width:54px; height:54px; border-radius:50%; border:6px solid rgba(255,255,255,.2);
    border-top-color:#ffe95e; animation:sp 1s linear infinite; }
  @keyframes sp{ to{ transform:rotate(360deg);} }

<script type="module">

import * as THREE from 'three';
import { PoseLandmarker, FilesetResolver } from '@mediapipe/tasks-vision';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

/* ============================================================
   عالم الحركة السحري — Magic Motion World
   Single-file camera-controlled kids game collection (ages 3-5)
   Three.js 0.160.0 + MediaPipe PoseLandmarker lite (pinned CDNs)
   ============================================================ */

const $ = (id) => document.getElementById(id);
const statusEl = $('status'), errEl = $('err');

function fail(msg){
  $('spin').style.display='none';
  errEl.style.display='block';
  errEl.innerHTML = msg;
  statusEl.textContent = 'حدثت مشكلة 😢';
}
function setStatus(t){ statusEl.textContent = t; }

/* ---------------- global state ---------------- */
let W = innerWidth, H = innerHeight;
let renderer, scene, camera;
const world = new THREE.Group();          // per-game content lives here
let video, stream = null;
let landmarker = null, lastVideoTime = -1, lastDetect = 0;
let poseLandmarks = [];                    // array of poses (arrays of {x,y,z,...})
let energy = 0;                            // body movement energy 0..1
const pointers = new Map();                // smoothed screen-space pointers

const G = { mode:'boot', game:null, stars:0, targets:[], elapsed:0, backTarget:null };

/* ---------------- audio (tiny synth + Arabic TTS) ---------------- */
let AC = null;
function audio(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return AC; }
function tone(f0, f1, dur, type='sine', vol=0.18){
  const ac = audio(); if(!ac) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, ac.currentTime);
  o.frequency.exponentialRampToValueAtTime(Math.max(f1,1), ac.currentTime+dur);
  g.gain.setValueAtTime(vol, ac.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime+dur);
  o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime+dur+0.02);
}
const sfxPop   = () => tone(500, 900, 0.12, 'triangle');
const sfxStar  = () => { tone(660, 990, 0.14, 'sine'); setTimeout(()=>tone(990,1320,0.18,'sine'), 90); };
const sfxOops  = () => tone(300, 180, 0.2, 'sawtooth', 0.08);

let arVoice = null, lastSay = 0;
function pickVoice(){
  const vs = speechSynthesis.getVoices();
  arVoice = vs.find(v=>/^ar/i.test(v.lang)) || null;
}
if ('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function say(text, force=false){
  if(!('speechSynthesis' in window)) return;
  const now = performance.now();
  if(!force && now - lastSay < 2600) return;
  lastSay = now;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ar-SA'; if(arVoice) u.voice = arVoice;
    u.rate = 0.95; u.pitch = 1.15; u.volume = 1;
    speechSynthesis.speak(u);
  }catch(e){}
}
const PRAISE = ['أحسنت!','رائع جدًا!','ممتاز!','برافو!','عظيم!','مذهل!','أنت نجم!'];
function praise(txt){
  const p = $('praise');
  p.textContent = txt || PRAISE[(Math.random()*PRAISE.length)|0];
  p.classList.remove('pop'); void p.offsetWidth; p.classList.add('pop');
  say(p.textContent);
}

/* ---------------- camera ---------------- */
async function listCameras(){
  const sel = $('camselect'); sel.innerHTML = '';
  const devices = (await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput');
  const saved = localStorage.getItem('mmw_cam');
  let preferred = saved;
  if(!preferred){
    const ext = devices.find(d=>/(usb|external|hdmi|elgato|cam ?link|capture|hd ?pro)/i.test(d.label))
             || devices.find(d=>!/(facetime|built|integrated|front)/i.test(d.label));
    preferred = ext ? ext.deviceId : (devices.length ? devices[devices.length-1].deviceId : null);
  }
  devices.forEach((d,i)=>{
    const o = document.createElement('option');
    o.value = d.deviceId; o.textContent = d.label || ('كاميرا ' + (i+1));
    sel.appendChild(o);
  });
  if(preferred) sel.value = preferred;
  return sel.value || null;
}
async function openCamera(deviceId){
  if(stream){ stream.getTracks().forEach(t=>t.stop()); stream = null; }
  const constraints = { audio:false, video: deviceId
    ? { deviceId:{ exact:deviceId }, width:{ideal:1280}, height:{ideal:720} }
    : { width:{ideal:1280}, height:{ideal:720} } };
  stream = await navigator.mediaDevices.getUserMedia(constraints);
  video.srcObject = stream;
  await video.play();
}

/* ---------------- MediaPipe pose ---------------- */
async function initPose(){
  setStatus('جارٍ تحميل نموذج تتبّع الحركة…');
  const fileset = await FilesetResolver.forVisionTasks(
    'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
  const model = 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task';
  const opts = (delegate) => ({
    baseOptions:{ modelAssetPath: model, delegate },
    runningMode:'VIDEO', numPoses: 2,
    minPoseDetectionConfidence: 0.5, minTrackingConfidence: 0.5
  });
  try{
    landmarker = await PoseLandmarker.createFromOptions(fileset, opts('GPU'));
  }catch(e){
    console.warn('GPU delegate failed, falling back to CPU', e);
    landmarker = await PoseLandmarker.createFromOptions(fileset, opts('CPU'));
  }
}
function detectTick(now){
  if(!landmarker || !video || video.readyState < 2) return;
  if(now - lastDetect < 48) return;                 // ~20 fps pose rate
  if(video.currentTime === lastVideoTime) return;
  lastDetect = now; lastVideoTime = video.currentTime;
  try{
    const res = landmarker.detectForVideo(video, now);
    poseLandmarks = res && res.landmarks ? res.landmarks : [];
  }catch(e){ /* keep last frame */ }
}

/* landmark (normalized, unmirrored) -> screen px (mirrored + cover-cropped) */
function lmToScreen(lm){
  const vw = video.videoWidth || 1280, vh = video.videoHeight || 720;
  const s = Math.max(W/vw, H/vh);
  const dw = vw*s, dh = vh*s;
  const ox = (W-dw)/2, oy = (H-dh)/2;
  return { x: ox + (1-lm.x)*dw, y: oy + lm.y*dh };
}
const WRIST_L=15, WRIST_R=16, INDEX_L=19, INDEX_R=20;
function updatePointers(dt){
  const seen = new Set();
  let move = 0, cnt = 0;
  for(let p=0; p<Math.min(poseLandmarks.length,2); p++){
    const lm = poseLandmarks[p]; if(!lm || lm.length < 21) continue;
    for(const idx of [WRIST_L, WRIST_R, INDEX_L, INDEX_R]){
      const l = lm[idx]; if(!l) continue;
      const s = lmToScreen(l);
      const key = p+':'+idx;
      seen.add(key);
      let pt = pointers.get(key);
      if(!pt){ pt = {x:s.x, y:s.y, px:s.x, py:s.y, active:true}; pointers.set(key, pt); }
      const k = Math.min(1, dt*14);
      pt.px = pt.x; pt.py = pt.y;
      pt.x += (s.x-pt.x)*k; pt.y += (s.y-pt.y)*k;
      move += Math.hypot(pt.x-pt.px, pt.y-pt.py); cnt++;
    }
    // body energy from hip/shoulder/wrist motion
    for(const idx of [11,12,23,24,15,16]){
      const l = lm[idx]; if(!l) continue;
      const s = lmToScreen(l);
      const key = p+':e'+idx;
      const prev = pointers.get(key);
      if(prev) move += Math.hypot(s.x-prev.x, s.y-prev.y)*0.5, cnt++;
      pointers.set(key, {x:s.x, y:s.y, energy:true});
      seen.add(key);
    }
  }
  for(const key of [...pointers.keys()]) if(!seen.has(key)) pointers.delete(key);
  const inst = cnt ? Math.min(1, (move/cnt) / (H*0.012)) : 0;
  energy = Math.max(inst, energy - dt*0.55);
}

/* mouse fallback pointer (testing) */
const mouse = {x:-9999, y:-9999, active:false};
addEventListener('pointermove', e=>{ mouse.x=e.clientX; mouse.y=e.clientY; mouse.active=true; });
function activePointers(){
  const list = [];
  for(const pt of pointers.values()) if(!pt.energy && pt.active) list.push(pt);
  if(mouse.active) list.push(mouse);
  return list;
}

/* ---------------- three.js setup (weak-GPU friendly) ---------------- */
function initThree(){
  renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true, powerPreference:'low-power' });
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.5));
  renderer.setSize(W, H);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  $('stage').appendChild(renderer.domElement);

  scene = new THREE.Scene();
  const dist = (H/2) / Math.tan(THREE.MathUtils.degToRad(23)); // z=0 plane: 1 unit = 1 px
  camera = new THREE.PerspectiveCamera(46, W/H, 10, dist*4);
  camera.position.set(0, 0, dist);
  scene.add(world);

  // soft studio environment from a tiny generated gradient (cheap reflections)
  const c = document.createElement('canvas'); c.width = 64; c.height = 32;
  const g = c.getContext('2d');
  const grd = g.createLinearGradient(0,0,0,32);
  grd.addColorStop(0,'#bfe3ff'); grd.addColorStop(.5,'#8f9bff'); grd.addColorStop(1,'#3a2a70');
  g.fillStyle = grd; g.fillRect(0,0,64,32);
  g.fillStyle = 'rgba(255,240,200,.9)'; g.beginPath(); g.arc(46,8,7,0,7); g.fill();
  const envTex = new THREE.CanvasTexture(c);
  envTex.mapping = THREE.EquirectangularReflectionMapping;
  scene.environment = envTex;

  scene.add(new THREE.HemisphereLight(0xcfe8ff, 0x554488, 1.15));
  const key = new THREE.DirectionalLight(0xfff2d8, 1.4); key.position.set(300, 500, 600); scene.add(key);
  const rim = new THREE.DirectionalLight(0x88aaff, 0.7); rim.position.set(-400, 200, 300); scene.add(rim);

  buildSparkles();
  addEventListener('resize', onResize);
}
function onResize(){
  W = innerWidth; H = innerHeight;
  renderer.setSize(W, H);
  camera.aspect = W/H;
  const dist = (H/2) / Math.tan(THREE.MathUtils.degToRad(23));
  camera.position.z = dist;
  camera.updateProjectionMatrix();
}
function s2w(x, y, z=0){ return new THREE.Vector3(x - W/2, H/2 - y, z); }

/* ---------------- shared textures / materials ---------------- */
function radialTex(inner='rgba(255,255,255,1)', outer='rgba(255,255,255,0)', size=128){
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(size/2,size/2,0,size/2,size/2,size/2);
  grd.addColorStop(0, inner); grd.addColorStop(.35, inner); grd.addColorStop(1, outer);
  g.fillStyle = grd; g.fillRect(0,0,size,size);
  return new THREE.CanvasTexture(c);
}
const glowTextures = {};
function glowSprite(color, scale=140, opacity=0.85){
  const key = color;
  if(!glowTextures[key]) glowTextures[key] = radialTex(color, 'rgba(0,0,0,0)');
  const m = new THREE.SpriteMaterial({ map:glowTextures[key], color:0xffffff,
    transparent:true, opacity, blending:THREE.AdditiveBlending, depthWrite:false });
  const sp = new THREE.Sprite(m); sp.scale.set(scale, scale, 1);
  return sp;
}
function glossy(color, emissive=0x000000, ei=0.25, rough=0.32){
  return new THREE.MeshStandardMaterial({ color, emissive, emissiveIntensity:ei,
    roughness:rough, metalness:0.08, envMapIntensity:0.9 });
}
function furMat(color){ // sheen-ish fur stand-in
  return new THREE.MeshStandardMaterial({ color, roughness:0.85, metalness:0,
    emissive:color, emissiveIntensity:0.08, envMapIntensity:0.5 });
}

/* ---------------- leaf frame + mushrooms (decor, rebuilt per game) ---------------- */
let leafTex = null;
function getLeafTex(){
  if(leafTex) return leafTex;
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d');
  g.translate(64,64);
  const grd = g.createLinearGradient(0,-56,0,56);
  grd.addColorStop(0,'#7be36b'); grd.addColorStop(1,'#1d7a3c');
  g.fillStyle = grd;
  g.beginPath(); g.moveTo(0,-58);
  g.bezierCurveTo(44,-30, 44,30, 0,58);
  g.bezierCurveTo(-44,30, -44,-30, 0,-58);
  g.fill();
  g.strokeStyle = 'rgba(255,255,255,.45)'; g.lineWidth = 3;
  g.beginPath(); g.moveTo(0,-50); g.lineTo(0,50); g.stroke();
  leafTex = new THREE.CanvasTexture(c);
  return leafTex;
}
function buildFrame(theme){
  const grp = new THREE.Group();
  const leafMat = new THREE.MeshBasicMaterial({ map:getLeafTex(), transparent:true,
    side:THREE.DoubleSide, depthWrite:false });
  const leafGeo = new THREE.PlaneGeometry(1,1);
  const cols = theme.leaf || ['#7be36b','#4fc36a','#2fa25b'];
  const n = 16;
  for(let i=0;i<n;i++){
    const t = i/(n-1);
    const side = i%2 ? 1 : -1;
    const x = side * (W/2 - 20 - Math.random()*90);
    const y = H/2 - t*(H-60) - 20;
    const leaf = new THREE.Mesh(leafGeo, leafMat.clone());
    leaf.material.color = new THREE.Color(cols[i%cols.length]);
    const s = 90 + Math.random()*110;
    leaf.scale.set(s*0.7, s, 1);
    leaf.position.set(x, y, 10 + i);
    leaf.rotation.z = side * (0.5 + Math.random()*0.9) + Math.sin(i)*0.2;
    leaf.userData.sway = Math.random()*6.28;
    grp.add(leaf);
  }
  // glowing mushrooms bottom corners
  for(const sx of [-1, 1]){
    const mgrp = new THREE.Group();

/* ---------------- sparkles + star-burst particles ---------------- */
let sparkGeo, sparkPts, sparkData;
function buildSparkles(){
  const N = 70;
  sparkData = [];
  sparkGeo = new THREE.BufferGeometry();
  const pos = new Float32Array(N*3);
  for(let i=0;i<N;i++){
    sparkData.push({ x:(Math.random()-0.5)*W, y:(Math.random()-0.5)*H,
      vy: 12+Math.random()*30, ph: Math.random()*6.28 });
  }
  sparkGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  sparkPts = new THREE.Points(sparkGeo, new THREE.PointsMaterial({
    map: radialTex('rgba(255,255,220,1)','rgba(255,255,220,0)',64),
    size: 14, transparent:true, opacity:.8, blending:THREE.AdditiveBlending, depthWrite:false }));
  scene.add(sparkPts);
}
function updateSparkles(dt, t){
  const pos = sparkGeo.attributes.position.array;
  for(let i=0;i<sparkData.length;i++){
    const s = sparkData[i];
    s.y += s.vy*dt;
    if(s.y > H/2){ s.y = -H/2; s.x = (Math.random()-0.5)*W; }
    pos[i*3] = s.x + Math.sin(t*0.8 + s.ph)*18;
    pos[i*3+1] = s.y;
    pos[i*3+2] = 60;
  }
  sparkGeo.attributes.position.needsUpdate = true;
}
const bursts = [];
function burst(sx, sy, color='#ffd54a', count=14, power=1){
  const grp = new THREE.Group();
  const parts = [];
  const tex = glowTextures[color] || (glowTextures[color] = radialTex(color,'rgba(0,0,0,0)'));
  for(let i=0;i<count;i++){
    const m = new THREE.Sprite(new THREE.SpriteMaterial({ map:tex, transparent:true,
      blending:THREE.AdditiveBlending, depthWrite:false }));
    const s = 12+Math.random()*22; m.scale.set(s,s,1);
    const a = Math.random()*6.28, sp = (160+Math.random()*340)*power;
    parts.push({ m, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp + 120*power, life:0.7+Math.random()*0.5 });
    grp.add(m);
  }
  grp.position.copy(s2w(sx, sy, 80));
  scene.add(grp);
  bursts.push({ grp, parts });
}
function updateBursts(dt){
  for(let i=bursts.length-1;i>=0;i--){
    const b = bursts[i]; let alive = false;
    for(const p of b.parts){
      if(p.life <= 0) continue;
      alive = true;
      p.life -= dt;
      p.vy -= 700*dt;
      p.m.position.x += p.vx*dt; p.m.position.y += p.vy*dt;
      p.m.material.opacity = Math.max(0, p.life);
    }
    if(!alive){ scene.remove(b.grp); b.parts.forEach(p=>p.m.material.dispose()); bursts.splice(i,1); }
  }
}

/* ---------------- dwell selection (0.3s default, no clicks) ---------------- */
const dwellEl = $('dwell');
const dwellState = new Map();  // targetKey -> progress seconds
function targetKey(t){ return t.id; }
function setTargets(list){ G.targets = list; }
function dwellTick(dt){
  const pts = activePointers();
  const covered = new Set();
  let ringShown = false;
  for(const t of G.targets){
    let inside = null;
    for(const p of pts){
      if(Math.hypot(p.x - t.x, p.y - t.y) <= t.r){ inside = p; break; }
    }
    const key = targetKey(t);
    if(inside){
      covered.add(key);
      const prev = dwellState.get(key) || 0;
      const prog = prev + dt;
      dwellState.set(key, prog);
      const need = t.dwell || 0.3;
      if(!ringShown){
        ringShown = true;
        dwellEl.style.display = 'block';
        dwellEl.style.left = t.x + 'px';
        dwellEl.style.top = t.y + 'px';
        dwellEl.style.setProperty('--p', Math.min(1, prog/need));
        const sc = Math.max(1, (t.r*2.2)/96);
        dwellEl.style.transform = 'scale(' + sc + ')';
      }
      if(prog >= need){
        dwellState.set(key, 0);
        t.onDone && t.onDone(t);
      }
    }
  }
  if(!ringShown) dwellEl.style.display = 'none';
  for(const key of [...dwellState.keys()])
    if(!covered.has(key)) dwellState.delete(key);
}

const THEMES = {
  jungle:  { leaf:['#7be36b','#4fc36a','#2fa25b'], mushroom:0xff6bd5, mushroomGlow:'rgba(255,120,220,.9)' },
  sea:     { leaf:['#5fd8e8','#3fa8d8','#7be3c8'], mushroom:0x5fb0ff, mushroomGlow:'rgba(110,190,255,.9)' },
  party:   { leaf:['#ff8ad5','#ffd06b','#8ad5ff'], mushroom:0xffd54a, mushroomGlow:'rgba(255,220,120,.9)' },
  forest:  { leaf:['#4fc36a','#8fd54a','#2fa25b'], mushroom:0xb06bff, mushroomGlow:'rgba(190,130,255,.9)' }

let frameGroup = null;

function clearWorld(){
  while(world.children.length){
    const c = world.children.pop();
    c.traverse(o=>{
      if(o.geometry && !o.geometry._shared) o.geometry.dispose();
      if(o.material && !o.material._shared){
        (Array.isArray(o.material)?o.material:[o.material]).forEach(m=>m.dispose());
      }
    });
  }
  while(bursts.length){ const b = bursts.pop(); scene.remove(b.grp); }
  frameGroup = null;
}

function startGame(i){
  clearWorld();
  G.mode = 'game';
  G.elapsed = 0;
  const g = GAMES[i];
  frameGroup = buildFrame(THEMES[g.theme] || THEMES.jungle);
  G.game = g;
  $('menu').style.display = 'none';
  $('backzone').style.display = 'flex';
  $('energywrap').style.display = g.usesEnergy ? 'block' : 'none';
  setQuestion('');
  dwellState.clear();
  g.init();
  say(g.title + '! هيّا نلعب!', true);
}
function toMenu(){
  if(G.game && G.game.dispose) G.game.dispose();
  G.game = null; G.mode = 'menu';
  clearWorld();
  frameGroup = buildFrame(THEMES.jungle);

function backzoneRect(){
  const r = $('backzone').getBoundingClientRect();
  return { x:r.left + r.width/2, y:r.top + r.height/2, r: Math.max(r.width, r.height)/2 };
}

/* ---------------- main loop ---------------- */
let lastT = 0;
function tick(now){
  const dt = Math.min(0.05, (now - lastT)/1000 || 0.016);
  lastT = now;
  const t = now/1000;
  detectTick(now);
  updatePointers(dt);

  if(G.mode === 'menu'){
    // dwell over big tiles
    const targets = [];
    document.querySelectorAll('.tile').forEach((tile, i)=>{
      const r = tile.getBoundingClientRect();
      targets.push({ id:'tile'+i, x:r.left+r.width/2, y:r.top+r.height/2,
        r: Math.min(r.width, r.height)/2, dwell: 1.0,
        onDone: ()=> startGame(i),
        el: tile });
    });
    setTargets(targets);
    // tile fill visuals
    document.querySelectorAll('.tile').forEach(tile=>{
      const prog = dwellState.get(tile.dataset.key) || 0;
      tile.querySelector('.tf').style.height = (prog*100) + '%';
    });
  } else if(G.mode === 'game' && G.game){
    G.elapsed += dt;
    $('timer').textContent = fmt(G.elapsed);
    const bz = backzoneRect();
    const bfill = $('backzone').querySelector('.fill');
    const bprog = dwellState.get('backzone') || 0;
    bfill.style.height = Math.min(1, bprog/0.8)*100 + '%';
    G.game.update(dt, t);
    G.targets.push({ id:'backzone', x:bz.x, y:bz.y, r:bz.r, dwell:0.8, onDone: toMenu });
  }
  dwellTick(dt);

  // decor animation
  if(frameGroup){
    frameGroup.children.forEach(o=>{
      if(o.userData.sway !== undefined) o.rotation.z += Math.sin(t*1.4 + o.userData.sway)*0.0009;
      if(o.userData.pulse !== undefined){
        const s = 1 + Math.sin(t*2 + o.userData.pulse)*0.06;
        o.scale.set(s, s, 1);
      }
    });
  }
  updateSparkles(dt, t);
  updateBursts(dt);
  renderer.render(scene, camera);
}

    this.model = makeAnimal(['bunny','cat','fox'][this.idx % 3]);
    this.model.position.set(-W/4, -H/2 + 60, 60);
    this.model.scale.setScalar(0.9);
    world.add(this.model);
    this.showPose();
  },
  showPose(){
    const p = this.poses[this.idx];
    setQuestion(p.txt);
    say(p.txt, true);
  },
  detect(lm){
    if(!lm || lm.length < 29) return false;
    const P = (i)=>lm[i];
    const hipY = (P(23).y + P(24).y)/2;
    const shoulderY = (P(11).y + P(12).y)/2;
    if(this.hipBase === null) this.hipBase = hipY;
    const wl = P(15), wr = P(16);
    const key = this.poses[this.idx].key;
    if(key === 'wings'){
      const wide = Math.abs(wl.x - wr.x) > 0.3;
      return wl.y < shoulderY - 0.04 && wr.y < shoulderY - 0.04 && wide;
    }
    if(key === 'hop'){
      const jumped = hipY < this.hipBase - 0.045;
      if(jumped) this.hipBase = hipY; // re-arm
      else this.hipBase += (hipY - this.hipBase)*0.02;
      return jumped;
    }
    if(key === 'sit'){
      const d = (a,b)=>Math.hypot(a.x-b.x, a.y-b.y);
      const kneeHipL = d(P(25), P(23)), kneeHipR = d(P(26), P(24));
      return kneeHipL < 0.15 && kneeHipR < 0.15 && hipY > this.hipBase - 0.02;
    }
    return false;
  },
  update(dt, t){
    // demo animal bounces
    const m = this.model;
    m.position.y = -H/2 + 60 + Math.abs(Math.sin(t*3))*26;
    m.rotation.y = Math.sin(t*1.2)*0.35;
    const u = m.userData;
    u.earL.rotation.z = 0.18 + Math.sin(t*4)*0.15;
    u.earR.rotation.z = -0.18 - Math.sin(t*4)*0.15;
    if(this.poses[this.idx].key === 'wings'){
      u.armL.rotation.z = 0.8 + Math.sin(t*8)*0.6;
      u.armR.rotation.z = -0.8 - Math.sin(t*8)*0.6;
    }
    const lm = poseLandmarks[0];
    if(this.detect(lm)){
      this.hold += dt;
      if(this.hold > 0.9){
        this.hold = 0;
        addStar();
        praise('قلّدته! 🎉');
        burst(W/2, H/2, '#a7ffb0', 20);
        this.idx = (this.idx + 1) % this.poses.length;
        this.hipBase = null;
        world.remove(this.model);
        this.model = makeAnimal(['bunny','cat','fox'][this.idx % 3]);
        this.model.position.set(-W/4, -H/2 + 60, 60);
        this.model.scale.setScalar(0.9);
        world.add(this.model);
        this.showPose();
      }
    } else this.hold = Math.max(0, this.hold - dt*2);
    setTargets([]);
  },
  dispose(){ setQuestion(''); }
};

/* ---- 9. Catch the stars: golden stars appear by your hands ----
   The child stays inside the live feed (as in the reference):
   stars spawn around the child's raised hands/head, and cute 3D
   party-hat critters stroll on glossy jungle leaves around them. */
function starGeo(outer=46, inner=21){
  const sh = new THREE.Shape();
  for(let i=0;i<10;i++){
    const r = (i%2) ? inner : outer;
    const a = (i/10)*Math.PI*2 - Math.PI/2;
    const x = Math.cos(a)*r, y = Math.sin(a)*r;
    if(i) sh.lineTo(x,y); else sh.moveTo(x,y);
  }
  sh.closePath();
  const geo = new THREE.ExtrudeGeometry(sh, { depth:14, bevelEnabled:true, bevelThickness:5, bevelSize:5, bevelSegments:2 });
  geo.translate(0, 0, -7);
  return geo;
}

    for(let i=0;i<3;i++) this.spawnCritter(i);
    setQuestion('امسك النجوم الذهبية! ⭐');
    say('امسك النجوم الذهبية التي بجانب يديك!', true);
  },
  buildLeaves(){
    // glossy jungle-leaf platforms around the child (never blocking them)
    const leafMat = glossy(0x35a04a, 0x1d7a3c, .3, .45);
    const rimMat = glossy(0x5fd86b, 0x2fa25b, .5, .35);
    const defs = [
      { x:-W*0.30, y:-H/2+190, w:300, h:100 },
      { x: W*0.30, y:-H/2+190, w:300, h:100 },
      { x:-W*0.42, y: H*0.22, w:240, h:80 },
      { x: W*0.42, y: H*0.30, w:240, h:80 }
    ];
    for(const d of defs){
      const leaf = new THREE.Mesh(new THREE.SphereGeometry(1, 20, 12), leafMat);
      leaf.scale.set(d.w, d.h, 46);
      leaf.position.set(d.x, d.y, 55);
      const rim = new THREE.Mesh(new THREE.TorusGeometry(1, .07, 8, 40), rimMat);
      rim.scale.set(d.w*.96, d.h*.96, 20);
      rim.position.set(d.x, d.y + d.h*.55, 60);
      rim.rotation.x = Math.PI/2;
      const gl = glowSprite('rgba(120,255,150,.55)', d.w*1.5, .25);
      gl.position.set(d.x, d.y, 40);
      world.add(leaf, rim, gl);
      this.leaves = this.leaves || [];
      this.leaves.push(d);
    }
  },
  spawnCritter(i){
    const colors = [0x8fd54a, 0xffb84d, 0x6fdd8c, 0xff8a6b];
    const g = makePartyCritter(colors[i % colors.length]);
    const leaf = this.leaves[i % 2]; // critters stroll on the lower leaves beside the child
    g.position.set(leaf.x + rand(-leaf.w*.5, leaf.w*.5), leaf.y + leaf.h*.72, 60);
    world.add(g);
    const dir = Math.random() < .5 ? 1 : -1;
    g.scale.x = dir;
    this.critters.push({ g, leaf, dir, speed: rand(50, 85), ph: rand(0,6.28), id: Math.random(), happy: 0 });
  },
  spawnStar(){
    if(!this.starMesh) this.starMesh = starGeo();
    const mat = glossy(0xffd54a, 0xffb300, .9, .18);
    mat.metalness = .45;
    const star = new THREE.Mesh(this.starMesh, mat);
    const gl = glowSprite('rgba(255,235,130,.95)', 210, .7);
    const g = new THREE.Group(); g.add(star, gl);
    // anchor near the child's hands/head when visible, else upper screen
    let sx = rand(-W*0.35, W*0.35), sy = rand(H*0.05, H*0.35);
    const lm = poseLandmarks[0];
    if(lm && lm.length > 20){
      const spots = [lm[15], lm[16], lm[0]].map(l=>lmToScreen(l));
      const sp = spots[(Math.random()*spots.length)|0];
      sx = sp.x + rand(-60, 60);
      sy = sp.y - rand(60, 200); // just above the hand/head, like the reference
      sx = Math.max(90, Math.min(W-90, sx));
      sy = Math.max(80, Math.min(H-80, sy));
    }
    g.position.copy(s2w(sx, sy, 70));
    world.add(g);
    this.stars.push({ g, ph: rand(0,6.28), life: 7, id: Math.random() });
  },
  update(dt, t){
    // keep 3-4 stars floating around the child
    this.spawnT -= dt;
    if(this.stars.length < 4 && this.spawnT <= 0){ this.spawnStar(); this.spawnT = 0.8; }
    const targets = [];
    for(let i=this.stars.length-1;i>=0;i--){
      const st = this.stars[i];
      st.life -= dt;
      st.g.rotation.z = Math.sin(t*2 + st.ph)*0.25;
      st.g.position.y += Math.sin(t*3 + st.ph)*22*dt;
      st.g.scale.setScalar(1 + Math.sin(t*4 + st.ph)*0.08);
      if(st.life <= 0){ world.remove(st.g); this.stars.splice(i,1); continue; }
      const s = w2s(st.g.position);
      targets.push({ id:'st'+st.id, x:s.x, y:s.y, r:85, dwell:0.3, onDone:()=>this.catchStar(st) });
    }
    for(const c of this.critters){
      c.happy = Math.max(0, c.happy - dt);
      if(c.happy > 0){
        c.g.position.y = c.leaf.y + c.leaf.h*.72 + Math.abs(Math.sin(t*9 + c.ph))*46;
      } else {
        c.g.position.x += c.dir * c.speed * dt;
        c.g.position.y = c.leaf.y + c.leaf.h*.72 + Math.abs(Math.sin(t*7 + c.ph))*6;
        const minX = c.leaf.x - c.leaf.w*.55, maxX = c.leaf.x + c.leaf.w*.55;
        if(c.g.position.x > maxX){ c.g.position.x = maxX; c.dir = -1; }
        if(c.g.position.x < minX){ c.g.position.x = minX; c.dir = 1; }
        c.g.scale.x = c.dir;
      }
      const u = c.g.userData;
      u.hat.rotation.z = -0.25 + Math.sin(t*5 + c.ph)*0.12;
      const s2 = w2s(c.g.position);
      targets.push({ id:'cr2'+c.id, x:s2.x, y:s2.y, r:70, dwell:0.35, onDone:()=>this.petCritter(c) });
    }
    setTargets(targets);
  },
  catchStar(st){
    const s = w2s(st.g.position);
    burst(s.x, s.y, '#ffe95e', 20, 1.15);
    world.remove(st.g);
    this.stars.splice(this.stars.indexOf(st), 1);
    this.caught++;
    addStar();
    if(this.caught % 3 === 0) praise('Super! ⭐');
    this.spawnT = Math.min(this.spawnT, 0.4);
  },
  petCritter(c){
    c.happy = 1.4;
    const s = w2s(c.g.position);
    burst(s.x, s.y, '#a7ffb0', 10, .7);
    sfxPop();
    if(Math.random() < .3){ addStar(); say('هذا لطيف!'); }
  },
  dispose(){ this.leaves = null; this.starMesh = null; setQuestion(''); }
};

/* ---------------- registry + start ---------------- */
const GAMES = [ gameFruit, gameGems, gameMimic, gameCritters,
                gameSteps, gameDance, gameBalloons, gameQuiz, gameStars ];

// optional GLB dancer (models/dancer.glb) — procedural fallback if absent
tryLoadGLB('models/dancer.glb').then(ok=>{
  console.log(ok ? 'GLB dancer loaded' : 'GLB not found — using procedural animals');
});

boot();
</script>
